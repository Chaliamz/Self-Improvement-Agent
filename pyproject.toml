[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tradekb"
version = "1.0.0"
description = "Trading journal and knowledge base for a self-improving trading agent"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
tj = "tradekb.cli:main"

[tool.setuptools]
packages = ["tradekb"]
