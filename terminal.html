* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

.top-actions select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.btn:hover, .top-actions select:hover { border-color: var(--brand); }

section.panel.active { display: block; }

.stack > * + * { margin-top: 16px; }

.tile .t-value { font-size: 22px; font-weight: 650; margin-top: 2px; }
.tile .t-sub { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 10px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters label { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 12.5px; }

#tooltip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: none; max-width: 260px; }
#tooltip strong { display: block; font-size: 14px; color: var(--ink); }
#tooltip .row { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
#tooltip .key { width: 12px; height: 2px; background: var(--pos); flex: none; }
details.table-view { margin-top: 10px; }
details.table-view summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
details.table-view .table-wrap { margin-top: 8px; }
.meter-bar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
.meter-bar > span { display: block; height: 100%; background: var(--fill); border-radius: 999px; }
.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 16px; margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
ul.clean { margin: 0; padding-left: 18px; }
ul.clean li + li { margin-top: 3px; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.score-row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; margin: 6px 0; }
.score-row .num { text-align: right; font-variant-numeric: tabular-nums; }
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(980px, calc(100vw - 32px)); max-height: 90vh; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.55); }
.dlg-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; z-index: 1; }
.dlg-head h2 { margin: 0; font-size: 16px; }
.dlg-body { padding: 16px; }
.chart-img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in; }
.empty { color: var(--ink-2); font-style: italic; margin: 4px 0; }
/* backgrounds: one decorative layer at a time, chosen in the header. Never over the data. */
body { position: relative; isolation: isolate; }
#bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; opacity: var(--bg-opacity); }
#bg > * { position: absolute; inset: 0; display: none; }
:root[data-bg="aurora"] #bg .bg-aurora, :root[data-bg="aurora"] #bg .bg-grid,
:root[data-bg-kind="canvas"] #bg #bg-canvas,
:root[data-bg="starfield"] #bg .bg-static, :root[data-bg="waves"] #bg .bg-static, :root[data-bg="depth"] #bg .bg-static,
:root[data-bg="nebula"] #bg .bg-nebula,
:root[data-bg="synthwave"] #bg .bg-synth,
:root[data-bg="tape"] #bg .bg-glow, :root[data-bg="tape"] #bg .bg-grid, :root[data-bg="tape"] #bg #bg-tape,
:root[data-bg="off"] #bg .bg-static { display: block; }
.bg-grid { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 64px 64px; opacity: .35;
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%); mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
  animation: grid-pan 60s linear infinite; }
.bg-static { background: radial-gradient(60% 50% at 15% 10%, var(--glow-brand), transparent 70%), radial-gradient(50% 40% at 90% 90%, var(--glow-accent), transparent 70%); }
/* aurora: three soft blobs on independent orbits; the teal/red one leans with net R */
.bg-aurora { filter: blur(48px); }
.bg-aurora i { position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%; }
.bg-aurora i:nth-child(1) { left: -12vmax; top: -18vmax; background: radial-gradient(circle, var(--glow-brand), transparent 65%); animation: orbit-a 28s ease-in-out infinite alternate; }
.bg-aurora i:nth-child(2) { right: -14vmax; bottom: -20vmax; background: radial-gradient(circle, var(--glow-up), transparent 65%); animation: orbit-b 34s ease-in-out infinite alternate; }
:root[data-pnl="down"] .bg-aurora i:nth-child(2) { background: radial-gradient(circle, var(--glow-down), transparent 65%); }
.bg-aurora i:nth-child(3) { left: 30vw; top: 20vh; width: 42vmax; height: 42vmax; background: radial-gradient(circle, var(--glow-accent), transparent 65%); animation: orbit-c 41s ease-in-out infinite alternate; }
@keyframes orbit-a { to { transform: translate3d(22vw, 16vh, 0) scale(1.15); } }
@keyframes orbit-b { to { transform: translate3d(-26vw, -14vh, 0) scale(1.1); } }
@keyframes orbit-c { 0% { transform: translate3d(-10vw, 0, 0) scale(.9); } 100% { transform: translate3d(12vw, 18vh, 0) scale(1.2); } }
/* synthwave: horizon glow, striped sun, grid floor rolling toward the viewer */
.bg-synth { background: linear-gradient(to bottom, transparent 30%, var(--glow-brand) 55%, transparent 56%); }
.bg-synth .sun { position: absolute; left: 50%; top: 20%; width: 34vmin; height: 34vmin; transform: translateX(-50%); border-radius: 50%;
  background: linear-gradient(to bottom, var(--brand), var(--down)); opacity: .28;
  -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 13px); mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 13px);
  animation: sun-pulse 6s ease-in-out infinite alternate; }
.bg-synth .floor { position: absolute; left: -50%; right: -50%; top: 55%; bottom: -40%; transform-origin: top; transform: perspective(320px) rotateX(62deg);
  background-image: linear-gradient(var(--brand) 1px, transparent 1px), linear-gradient(90deg, var(--brand) 1px, transparent 1px); background-size: 56px 56px; opacity: .22;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%); mask-image: linear-gradient(to bottom, transparent, #000 40%);
  animation: floor-roll 2.4s linear infinite; }
@keyframes floor-roll { to { background-position: 0 56px, 0 0; } }
@keyframes sun-pulse { to { opacity: .4; transform: translateX(-50%) scale(1.04); } }
/* nebula: slow-turning purple, teal and red clouds under a twinkling dust layer */
.bg-nebula::before, .bg-nebula::after { content: ""; position: absolute; }
.bg-nebula::before { inset: -35%; filter: blur(40px) saturate(1.3); animation: nebula-turn 120s linear infinite;
  background:
    radial-gradient(28% 24% at 32% 38%, color-mix(in srgb, var(--brand) 42%, transparent), transparent 70%),
    radial-gradient(24% 20% at 66% 58%, color-mix(in srgb, var(--up) 30%, transparent), transparent 70%),
    radial-gradient(20% 18% at 56% 30%, color-mix(in srgb, var(--down) 26%, transparent), transparent 70%),
    radial-gradient(34% 28% at 40% 72%, color-mix(in srgb, var(--pos) 22%, transparent), transparent 70%),
    radial-gradient(18% 16% at 74% 36%, color-mix(in srgb, var(--brand) 30%, transparent), transparent 70%); }
.bg-nebula::after { inset: 0; opacity: .55; animation: twinkle 7s ease-in-out infinite alternate;
  background-image:
    radial-gradient(1.4px 1.4px at 12px 18px, var(--ink-2) 50%, transparent 51%),
    radial-gradient(1px 1px at 88px 64px, var(--brand) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 150px 130px, var(--ink-2) 50%, transparent 51%),
    radial-gradient(1px 1px at 40px 150px, var(--up) 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 170px 30px, var(--ink-2) 50%, transparent 51%);
  background-size: 190px 190px; }
@keyframes nebula-turn { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.12); } to { transform: rotate(360deg) scale(1); } }
@keyframes twinkle { from { opacity: .25; } to { opacity: .6; } }
/* candle tape (the previous background) */
.bg-glow { background:
    radial-gradient(40% 34% at 18% 22%, var(--glow-up), transparent 70%),
    radial-gradient(34% 30% at 82% 78%, var(--glow-down), transparent 70%),
    radial-gradient(30% 28% at 60% 12%, var(--glow-brand), transparent 70%);
  animation: drift 38s ease-in-out infinite alternate; inset: -25% !important; }
#bg-tape { top: auto !important; height: 42vh; opacity: var(--tape-opacity);
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 100%); mask-image: linear-gradient(to top, #000 10%, transparent 100%); }
#bg-tape .strip { display: flex; width: max-content; height: 100%; animation: tape 120s linear infinite; }
#bg-tape svg { height: 100%; width: auto; flex: none; }
#bg-tape .c-up { fill: var(--up); stroke: var(--up); } #bg-tape .c-down { fill: var(--down); stroke: var(--down); }
#bg-canvas { width: 100%; height: 100%; }
.tag { background: var(--brand-wash); }
svg .bar-up { fill: var(--up); } svg .bar-down { fill: var(--down); }
svg .grow-down { transform-box: fill-box; transform-origin: top; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
svg .whisker { stroke: var(--ink-2); stroke-width: 1.5; }

svg .hit:hover + .mark, svg .hit:focus + .mark { opacity: .8; }

@keyframes grid-pan { from { background-position: 0 0, 0 0; } to { background-position: 64px 64px, 64px 64px; } }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--up-wash); } 50% { box-shadow: 0 0 0 6px transparent; } }
section.panel.active .stack > * { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
section.panel.active .stack > *:nth-child(2) { animation-delay: .05s; } section.panel.active .stack > *:nth-child(3) { animation-delay: .1s; }
section.panel.active .stack > *:nth-child(4) { animation-delay: .15s; } section.panel.active .stack > *:nth-child(5) { animation-delay: .2s; }
section.panel.active .stack > *:nth-child(n+6) { animation-delay: .25s; }
.card, .tile { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
.tile:hover { transform: translateY(-2px); border-color: var(--axis); box-shadow: var(--shadow); }
.tile[data-tone="up"] { border-top: 2px solid var(--up); } .tile[data-tone="down"] { border-top: 2px solid var(--down); }
.tile[data-tone="up"] .t-value { color: var(--up-text); } .tile[data-tone="down"] .t-value { color: var(--down-text); }
.hero .value.up { color: var(--up-text); text-shadow: 0 0 28px var(--up-wash); } .hero .value.down { color: var(--down-text); text-shadow: 0 0 28px var(--down-wash); }
.up { color: var(--up-text); } .down { color: var(--down-text); }
tr.row-win td:first-child { box-shadow: inset 3px 0 0 var(--up); } tr.row-loss td:first-child { box-shadow: inset 3px 0 0 var(--down); }
tr.row-win:hover td { background: var(--up-wash) !important; } tr.row-loss:hover td { background: var(--down-wash) !important; }
.meter-bar > span { transition: width .9s cubic-bezier(.2,.7,.2,1); }
svg .grow { transform-box: fill-box; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
svg .draw { animation: fade .6s ease both; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--up); animation: pulse 2.4s ease-in-out infinite; margin-right: 8px; vertical-align: 2px; }
.stage { border-left: 3px solid var(--border); }

.crit { display: grid; grid-template-columns: 22px 1fr minmax(90px, 160px); gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--grid); }

.crit .t { font-size: 12px; color: var(--ink-2); }
.rc { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.rc.ok { background: var(--up-wash); color: var(--up-text); } .rc.bad { background: var(--down-wash); color: var(--down-text); }

.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 12px; }
ol.checklist { margin: 0; padding-left: 0; list-style: none; counter-reset: none; }
ol.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--grid); }
ol.checklist li:first-child { border-top: 0; }
ol.checklist .box { flex: none; width: 18px; height: 18px; margin-top: 1px; border: 2px solid var(--brand); border-radius: 5px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
footer { color: var(--muted); font-size: 12px; padding: 16px 0 32px; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
@media (max-width: 600px) { .hero .value { font-size: 44px; } .kv { grid-template-columns: 1fr; gap: 2px 0; } .kv dd { margin-bottom: 8px; } }

e CLOSE below the last higher low (mirror, confirmed)."],"market_conditions":[],"required_conditions":["CHoCH on the 4H in the trade's direction, close-based (see market_structure)."],"confirmation":["Reversal on the 4H (bullish for longs, bearish for shorts)","Extreme demand level (longs) / extreme supply level (shorts)"],"confluences":["Liquidity sweep","Strong momentum + volume in the trade's direction","Inducement (equal lows below for longs, equal highs above for shorts)","Potential opposing level (used for the target)","Divergence at the swing: bearish for shorts, bullish for longs (trader, T-0004)"],"zones":{"extreme_demand":"The full wick-to-wick range of the candle at the lower low that formed massive volume and a point of interest (trader, 2026-09-26). T-0001: 85.61 to 88.05.","extreme_supply":"Mirror: the full wick-to-wick range of the high-volume candle at the higher high."},"entry_models":{"extreme_demand":"Primary (long): at the extreme demand level.","extreme_supply":"Primary (short): at the extreme supply level (mirror), including a new supply formed by a liquidity sweep above an obvious high (T-0005, \"the proper trade\").","reclaim":"Secondary: longs when price reclaims a swept level as support; shorts when price loses a swept level and retests it as resistance. Used when the primary entry was missed (T-0001)."},"stop_model":"Placed where the setup is invalidated. Longs: below the demand zone, the swing low, or a liquidity level. Shorts: above the supply zone, the swing high, or a liquidity level (trader, 2026-09-26). T-0001: at a liquidity level from the left that had been reclaimed as support. A return there means price reverses lower or goes into consolidation, and the setup is invalid. Not just beyond an obvious swing high/low: that is liquidity price sweeps before reversing, and the valid entry forms exactly there (trader, T-0004: \"valid short position would be exactly on where I put my SL\"). The stop goes beyond the zone that forms from the sweep (T-0005: above the new supply).","target_model":"Next opposing level. High R:R is hunted: 1:3 minimum preferred, 1:2.5 accepted (trader, 2026-09-26).","filters":{"min_rr":2.5,"preferred_rr":3.0},"risk_model":"1% of equity per trade, always.","leverage_model":"Isolated margin. Leverage is chosen so that the loss on the posted margin at the stop (stop distance % x leverage) does not exceed 50%: leverage <= 50 / stop %. T-0001: 3.14% x 10x = 31.4%. Leverage never changes the 1% risk.","management":{"default":"Hold until TP hits.","breakeven":"Barely used.","partials":"Barely used.","trailing":null,"reentry":null,"max_hold":null,"early_exit":null,"invalidation":"Stop at the invalidation level (see stop_model)."},"do_not_trade_when":["Best target gives less than 2.5R.","The lower-timeframe CHoCH is not confirmed on 15m-30m (T-0004)."],"checklist":["1. HTF key level or supply/demand zone identified (4h).","2. Liquidity swept into the zone (equal highs/lows or an obvious swing).","3. CHoCH by candle close, confirmed on 15m-30m; a 5m CHoCH alone does not count.","4. Entry at the zone (supply for shorts, demand for longs), not at a lower-timeframe CHoCH below/above it.","5. Stop beyond the zone, not just beyond the obvious swing where the liquidity sits.","6. Leverage <= 50 / stop % (isolated) and best target >= 2.5R (3R preferred)."],"common_mistakes":["ignored_htf","stop_in_liquidity","excessive_leverage"],"open_questions":["1. Which lows does the close-below rule apply to? After the AAVE CHoCH, candles closed below the Apr 15 swing low (about 97.08) and later below the equal lows (about 87.12 close on Apr 20). Was structure still bullish because only the lower low at the red box (about 85.73) mattered? Or did those closes turn it bearish?","2. When the zone edge, the swing low and a liquidity level are all possible stops, which one is chosen: the nearest that invalidates the setup, the one under the most liquidity, or another rule?","3. 'Massive volume': how much more than usual? For example, at least 2x the average of the previous 20 candles.","4. Target: when several opposing levels exist, is it the first one that gives at least 2.5R, or the strongest level?","5. Equal lows/highs: how close must they be to count as equal? In T-0001 they sat within about 0.4 (about 0.45% of price).","6. 30m confirmation: what exactly counts? A 30m candle closing below the previous bullish 30m candle's low, or a full 30m CHoCH by close?","7. Divergence: which RSI length and timeframe, and is it measured on wicks or closes?","8. How is a new supply drawn? In T-0005 it is 0.013492-0.013844, but the sweep candle ran 0.013412-0.013813 wick to wick (the red-box rule)."]}},"changes":[{"id":"CHG-001","kind":"clarification","date":"2026-09-26","status":"adopted","rule_changed":false,"statement":"Trader, 2026-09-26: \"Entry to SL range (invalidation) was 3,14% so I used 10x leverage. Risk management always goes to 1%. *IMPORTANT* Creating a Lower low must close BELOW the previous wick/low and vise versa. 1) invalidated setup - possible deviation/fakeout 2) 1% risk per trade 3) I barely use break even and partials, I hold until TP hits. Hunting good RR setups is important 4) red box 5) 4h\"","fields":["timeframes.execution","market_structure","zones.extreme_demand","entry_models","stop_model","target_model","risk_model","leverage_model","management","open_questions"],"note":"These rules were in force when T-0001 was taken; v1.0 recorded them incompletely. T-0001 and T-0002 are retagged to 1.1 so per-version statistics are not split by a documentation change.","resulting_version":"1.1"},{"id":"CHG-002","kind":"clarification","date":"2026-09-26","status":"adopted","rule_changed":false,"statement":"Trader, 2026-09-26: \"1) stop mostly gets placed to invalidate a setup ... I place my stop loss below demand/supply or swing low/high or below/above a liquidity level. 2) on AAVE chart, stop was the liquidity level which reclaimed support level from left ... in <script>
"use strict";

const KB = JSON.parse(document.getElementById("kb-data").textContent);
const CHARTS = JSON.parse(document.getElementById("kb-charts").textContent) || {};

/* ---------- DOM helpers: every piece of data enters the DOM as text, never as HTML ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, text) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

/* ---------- formatting ---------- */
const MINUS = "−";
const isNum = x => typeof x === "number" && isFinite(x);
const fmtR = x => !isNum(x) ? "—" : (x > 0 ? "+" : x < 0 ? MINUS : "") + Math.abs(x).toFixed(2) + "R";
const fmtFrac = (x, d = 0) => !isNum(x) ? "—" : (x * 100).toFixed(d) + "%";
const fmtPct = (x, d = 2) => !isNum(x) ? "—" : x.toFixed(d) + "%";
const fmtNum = (x, d = 2) => !isNum(x) ? "—" : x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPrice = x => !isNum(x) ? "—" : String(x);
const fmtX = x => !isNum(x) ? "—" : x.toFixed(2) + "x";
const fmtCap = x => !isNum(x) ? "—" : (Math.floor(x * 100 + 1e-9) / 100).toFixed(2) + "x";   // a ceiling: never round up
const fmtCI = ci => !ci ? "—" : `[${fmtR(ci[0])}, ${fmtR(ci[1])}]`;
const fmtTick = x => (x > 0 ? "+" : x < 0 ? MINUS : "") + (Number.isInteger(x) ? Math.abs(x) : Math.abs(x).toFixed(1)) + "R";
const titleCase = str => String(str).replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
const tagLabel = (tax, tag) => ((KB.taxonomy[tax] || {})[tag] || {}).label || titleCase(tag);

const STATUS = {
  win: ["var(--up)", "▲ Win"], loss: ["var(--down)", "▼ Loss"], breakeven: ["var(--neutral)", "● Breakeven"],
  long: ["var(--up)", "▲ Long"], short: ["var(--down)", "▼ Short"], done: ["var(--up)", "✓ Done"], active: ["var(--brand)", "In progress"], locked: ["var(--neutral)", "Locked"],
  missed: ["var(--neutral)", "○ Missed"], not_taken: ["var(--neutral)", "○ Not taken"],
  planned: ["var(--brand)", "◇ Planned"], open: ["var(--warning)", "◐ Open"],
  CRITICAL: ["var(--critical)", "Critical"], ERROR: ["var(--critical)", "Error"], WARN: ["var(--warning)", "Warning"],
  INFO: ["var(--neutral)", "Info"], recurring: ["var(--serious)", "Recurring"],
};
function badge(key, label) {
  const [color, text] = STATUS[key] || ["var(--neutral)", titleCase(key)];
  return h("span", { class: "badge" }, h("span", { class: "dot", style: `background:${color}` }), label || text);
}
const unstated = (text = "Unstated") => h("span", { class: "badge unstated", text });
const tone = x => !isNum(x) || Math.abs(x) < 1e-12 ? null : x > 0 ? "up" : "down";
const rSpan = x => h("span", { class: tone(x), text: fmtR(x) });
const dirBadge = d => d === "long" || d === "short" ? badge(d) : "—";
function tradeBadge(t) {
  if (t.status === "closed") return t.derived.outcome ? badge(t.derived.outcome) : badge("INFO", "No R");
  return badge(t.status);
}
function tile(label, value, sub, toneKey) {
  return h("div", { class: "tile", "data-tone": toneKey || null }, h("div", { class: "t-label", text: label }), h("div", { class: "t-value", text: value }),
           sub ? h("div", { class: "t-sub", text: sub }) : null);
}
function card(title, note, ...kids) {
  return h("div", { class: "card" }, title ? h("h2", { text: title }) : null, note ? h("p", { class: "note", text: note }) : null, ...kids);
}
function meter(frac) {
  return h("div", { class: "meter-bar", role: "meter", "aria-valuemin": 0, "aria-valuemax": 100,
                    "aria-valuenow": Math.round(frac * 100) }, h("span", { style: `width:${Math.max(0, Math.min(1, frac)) * 100}%` }));
}
function table(cols, rows, opts = {}) {
  const thead = h("thead", {}, h("tr", {}, cols.map(c => h("th", { class: c.th || (c.num ? "num" : null), scope: "col", text: c.label, title: c.title || null }))));
  const tbody = h("tbody", {}, rows.map(r => {
    const tr = h("tr", { class: [opts.onRow ? "clickable" : "", opts.rowClass ? opts.rowClass(r) || "" : ""].join(" ").trim() || null },
      cols.map(c => {
        const v = c.render ? c.render(r) : r[c.key];
        return h("td", { class: [c.num ? "num" : "", c.wrap ? "wrap-cell" : "", c.td || ""].join(" ").trim() || null },
                 v instanceof Node ? v : (v === null || v === undefined || v === "" ? "—" : String(v)));
      }));
    if (opts.onRow) tr.addEventListener("click", e => { if (!e.target.closest("button")) opts.onRow(r); });
    return tr;
  }));
  if (!rows.length) tbody.append(h("tr", {}, h("td", { colspan: cols.length, class: "empty", text: opts.empty || "No data yet." })));
  return h("div", { class: "table-wrap" }, h("table", {}, thead, tbody));
}
function list(items, empty = "None recorded.") {
  if (!items || !items.length) return h("p", { class: "empty", text: empty });
  return h("ul", { class: "clean" }, items.map(i => h("li", {}, i instanceof Node ? i : String(i))));
}
function tags(items, tax) {
  if (!items || !items.length) return "—";
  return h("span", {}, items.map(t => h("span", { class: "tag", text: tax ? tagLabel(tax, t) : String(t) })));
}

/* ---------- motion: count-up, background tape, ambient state ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el, target) {
  if (reduceMotion || !isNum(target)) return;
  const t0 = performance.now(), dur = 900;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmtR(target * e); if (k < 1) requestAnimationFrame(step); else el.textContent = fmtR(target); };
  requestAnimationFrame(step);
}
function backgroundTape() {
  const host = document.getElementById("bg-tape");
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const n = 110, w = 10, gap = 8, H = 400, candles = [];
  let price = 100;
  for (let i = 0; i < n; i++) {
    const open = price, close = open * (1 + (rnd() - 0.48) * 0.06);
    const high = Math.max(open, close) * (1 + rnd() * 0.02), low = Math.min(open, close) * (1 - rnd() * 0.02);
    candles.push({ open, close, high, low }); price = close;
  }
  const lo = Math.min(...candles.map(c => c.low)), hi = Math.max(...candles.map(c => c.high));
  const Y = v => H - 20 - (v - lo) / (hi - lo) * (H - 40);
  const make = () => {
    const svgEl = s("svg", { viewBox: `0 0 ${n * (w + gap)} ${H}`, preserveAspectRatio: "none" });
    candles.forEach((c, i) => {
      const x = i * (w + gap), cls = c.close >= c.open ? "c-up" : "c-down";
      svgEl.append(s("line", { x1: x + w / 2, x2: x + w / 2, y1: Y(c.high), y2: Y(c.low), class: cls, "stroke-width": 1.5 }));
      svgEl.append(s("rect", { x, y: Math.min(Y(c.open), Y(c.close)), width: w, height: Math.max(2, Math.abs(Y(c.open) - Y(c.close))), rx: 1.5, class: cls }));
    });
    return svgEl;
  };
  host.append(h("div", { class: "strip" }, make(), make()));
}

/* ---------- tooltip ---------- */
const tip = document.getElementById("tooltip");
function showTip(value, lines, x, y) {
  tip.replaceChildren(h("strong", { text: value }), ...lines.map(l => h("div", { class: "row" }, l.key ? h("span", { class: "key", style: `background:${l.key}` }) : null, l.text)));
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x + 14)) + "px";
  tip.style.top = Math.max(8, Math.min(window.innerHeight - r.height - 8, y - r.height - 12)) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

/* ---------- charts ---------- */
function niceTicks(min, max, count = 4) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) out.push(Number(v.toFixed(10)));
  return out;
}
