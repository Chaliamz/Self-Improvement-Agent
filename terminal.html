<script>
"use strict";
/* RISK-MATH:BEGIN — mirrors tradekb/risk.py; tests/test_terminal.py checks parity in node. */
const RiskMath = (() => {
  function inferSide(entry, stop) {
    if (stop < entry) return "long";
    if (stop > entry) return "short";
    throw new Error("entry equals stop: stop distance is zero, position size is undefined");
  }
  function positive(name, v, optional) {
    if ((v === null || v === undefined) && optional) return;
    if (!(typeof v === "number" && isFinite(v) && v > 0)) throw new Error(name + " must be > 0");
  }
  function decimals(step) {
    const s = String(step);
    return s.includes("e-") ? Number(s.split("e-")[1]) : (s.split(".")[1] || "").length;
  }
  function floorToStep(qty, step) {
    const n = Math.floor(qty / step + 1e-9);
    return Number((n * step).toFixed(decimals(step)));
  }
  function liquidation(entry, side, qty, o) {
    const { leverage = null, marginMode = "isolated", mmrRate = 0.005, equity = null } = o;
    let p;
    if (marginMode === "isolated") {
      if (!leverage) return null;
      p = side === "long" ? entry * (1 - 1 / leverage) / (1 - mmrRate) : entry * (1 + 1 / leverage) / (1 + mmrRate);
    } else if (marginMode === "cross") {
      if (!equity || qty <= 0) return null;
      p = side === "long" ? (entry - equity / qty) / (1 - mmrRate) : (entry + equity / qty) / (1 + mmrRate);
    } else throw new Error("margin mode must be isolated or cross");
    return p > 0 ? p : null;
  }
  function size(inp) {
    const { entry, stop, riskAmount, side: asserted = null, equity = null, leverage = null, marginMode = "isolated",
            mmrRate = 0.005, feeRate = 0, slippagePct = 0, qtyStep = null, targets = [], maxRiskPct = null,
            maxLeverage = null, feeShareWarn = 0.2, liqBufferWarn = 1.5 } = inp;
    positive("entry", entry); positive("stop", stop); positive("risk amount", riskAmount);
    positive("equity", equity, true); positive("leverage", leverage, true); positive("qty step", qtyStep, true);
    if (!(mmrRate >= 0 && mmrRate < 1)) throw new Error("maintenance margin rate must be in [0, 1)");
    if (feeRate < 0 || slippagePct < 0) throw new Error("fees and slippage cannot be negative");
    const side = inferSide(entry, stop);
    if (asserted && asserted !== side) throw new Error("stop is on the wrong side of entry for a " + asserted);
    const flags = [];
    if (feeRate > 0.01) flags.push(["WARN", "fee rate above 1% per side: enter it as a percent, e.g. 0.06"]);
    const slip = slippagePct / 100;
    const stopFill = side === "long" ? stop * (1 - slip) : stop * (1 + slip);
    const feePerUnit = feeRate * (entry + stopFill);
    const perUnitLoss = Math.abs(entry - stopFill) + feePerUnit;
    const qtyRaw = riskAmount / perUnitLoss;
    const qty = qtyStep ? floorToStep(qtyRaw, qtyStep) : qtyRaw;
    if (qty <= 0) flags.push(["CRITICAL", "risk budget is smaller than one quantity step at this stop distance"]);
    const lossAtStop = qty * perUnitLoss, notional = qty * entry;
    const stopDistancePct = Math.abs(entry - stop) / entry * 100;
    const feeShare = feePerUnit / perUnitLoss;
    if (feeShare > feeShareWarn) flags.push(["WARN", `fees are ${(feeShare * 100).toFixed(0)}% of the loss at stop: net R:R is materially below gross`]);
    let riskPct = null, effectiveLeverage = null;
    if (equity) {
      riskPct = lossAtStop / equity * 100;
      effectiveLeverage = notional / equity;
      if (maxRiskPct !== null && riskPct > maxRiskPct + 1e-9) flags.push(["CRITICAL", `loss at stop is ${riskPct.toFixed(2)}% of equity, above your max ${maxRiskPct}%`]);
    }
    let marginRequired = null;
    if (leverage) {
      marginRequired = notional / leverage;
      if (equity && marginRequired > equity) flags.push(["CRITICAL", "margin required exceeds equity"]);
      if (maxLeverage !== null && leverage > maxLeverage) flags.push(["WARN", `leverage ${leverage}x is above your max ${maxLeverage}x`]);
      if (marginMode === "isolated" && mmrRate >= 1 / leverage) flags.push(["CRITICAL", "this leverage liquidates at or before entry"]);
    }
    let liq = null, liqToStop = null;
    if (qty > 0 && (leverage || marginMode === "cross")) liq = liquidation(entry, side, qty, { leverage, marginMode, mmrRate, equity });
    if (liq !== null) {
      const stopDist = Math.abs(entry - stopFill);
      liqToStop = Math.abs(entry - liq) / stopDist;
      const beyond = side === "long" ? liq >= stopFill : liq <= stopFill;
      if (beyond) flags.push(["CRITICAL", "liquidation is reached BEFORE the stop: the stop cannot protect this position"]);
      else if (liqToStop < liqBufferWarn) flags.push(["WARN", `liquidation is only ${liqToStop.toFixed(2)}x the stop distance from entry`]);
    }
    const rr = targets.map(tp => {
      positive("target", tp);
      if ((side === "long" && tp <= entry) || (side === "short" && tp >= entry)) throw new Error(`target ${tp} is not on the profit side of entry`);
      return { price: tp, rrGross: Math.abs(tp - entry) / Math.abs(entry - stop),
               rrNet: (Math.abs(tp - entry) - feeRate * (entry + tp)) / perUnitLoss };
    });
    return { side, qty, qtyRaw, notional, stopFill, stopDistancePct, perUnitLoss, feePerUnit, lossAtStop, riskPct,
             effectiveLeverage, marginRequired, liquidation: liq, liqToStop, targets: rr, flags };
  }
  return { inferSide, floorToStep, liquidation, size };
})();
/* RISK-MATH:END */

const KB = JSON.parse(document.getElementById("kb-data").textContent);
const CHARTS = JSON.parse(document.getElementById("kb-charts").textContent) || {};

/* ---------- DOM helpers: every piece of data enters the DOM as text, never as HTML ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, text) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

/* ---------- formatting ---------- */
const MINUS = "−";
const isNum = x => typeof x === "number" && isFinite(x);
const fmtR = x => !isNum(x) ? "—" : (x > 0 ? "+" : x < 0 ? MINUS : "") + Math.abs(x).toFixed(2) + "R";
const fmtFrac = (x, d = 0) => !isNum(x) ? "—" : (x * 100).toFixed(d) + "%";
const fmtPct = (x, d = 2) => !isNum(x) ? "—" : x.toFixed(d) + "%";
const fmtNum = (x, d = 2) => !isNum(x) ? "—" : x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPrice = x => !isNum(x) ? "—" : String(x);
const fmtX = x => !isNum(x) ? "—" : x.toFixed(2) + "x";
const fmtCI = ci => !ci ? "—" : `[${fmtR(ci[0])}, ${fmtR(ci[1])}]`;
const fmtTick = x => (x > 0 ? "+" : x < 0 ? MINUS : "") + (Number.isInteger(x) ? Math.abs(x) : Math.abs(x).toFixed(1)) + "R";
const titleCase = str => String(str).replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
const tagLabel = (tax, tag) => ((KB.taxonomy[tax] || {})[tag] || {}).label || titleCase(tag);

const STATUS = {
  win: ["var(--good)", "▲ Win"], loss: ["var(--critical)", "▼ Loss"], breakeven: ["var(--neutral)", "● Breakeven"],
  missed: ["var(--neutral)", "○ Missed"], not_taken: ["var(--neutral)", "○ Not taken"],
  planned: ["var(--pos)", "◇ Planned"], open: ["var(--warning)", "◐ Open"],
  CRITICAL: ["var(--critical)", "Critical"], ERROR: ["var(--critical)", "Error"], WARN: ["var(--warning)", "Warning"],
  INFO: ["var(--neutral)", "Info"], recurring: ["var(--serious)", "Recurring"],
};
function badge(key, label) {
  const [color, text] = STATUS[key] || ["var(--neutral)", titleCase(key)];
  return h("span", { class: "badge" }, h("span", { class: "dot", style: `background:${color}` }), label || text);
}

/* ---------- charts ---------- */
function niceTicks(min, max, count = 4) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) out.push(Number(v.toFixed(10)));
  return out;
}

  new ResizeObserver(render).observe(host);
  render();
}
function equityChart(host, curve) {
  const pts = [{ id: "Start", date: null, r: 0, cum_r: 0 }, ...curve];
  responsive(host, W => {
    const H = 240, m = { t: 16, r: 70, b: 30, l: 52 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const vals = pts.map(p => p.cum_r), yt = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
    const y0 = yt[0], y1 = yt[yt.length - 1];
    const X = i => m.l + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1));
    const Y = v => m.t + ih - (v - y0) / (y1 - y0) * ih;
    const root = s("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
                            "aria-label": `Cumulative R over ${curve.length} closed trades, ending at ${fmtR(vals[vals.length - 1])}` });
    for (const v of yt) {
      root.append(s("line", { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), class: v === 0 ? "axis" : "grid" }));
      root.append(s("text", { x: m.l - 8, y: Y(v), "text-anchor": "end", "dominant-baseline": "middle" }, fmtTick(v)));
    }
    const every = Math.max(1, Math.ceil(pts.length / Math.max(2, Math.floor(iw / 70))));
    pts.forEach((p, i) => {
      if (i % every === 0 || i === pts.length - 1)
        root.append(s("text", { x: X(i), y: H - 8, "text-anchor": i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle" }, p.id));
    });
    const d = pts.map((p, i) => `${i ? "L" : "M"}${X(i)},${Y(p.cum_r)}`).join("");
    root.append(s("path", { d: `${d}L${X(pts.length - 1)},${Y(0)}L${X(0)},${Y(0)}Z`, class: "area" }));
    root.append(s("path", { d, class: "line" }));
    pts.forEach((p, i) => { if (i > 0) root.append(s("circle", { cx: X(i), cy: Y(p.cum_r), r: 4, class: "dot" })); });
    const last = pts[pts.length - 1];
    root.append(s("text", { x: X(pts.length - 1) + 10, y: Y(last.cum_r), class: "end-label", "dominant-baseline": "middle" }, fmtR(last.cum_r)));
    const cross = s("line", { class: "crosshair", y1: m.t, y2: m.t + ih, visibility: "hidden" });
    const hit = s("rect", { x: m.l - 8, y: m.t, width: iw + 16, height: ih, fill: "transparent", tabindex: 0,
                            "aria-label": "Cumulative R chart: use left and right arrow keys to read each trade" });
    root.append(cross, hit);
    let idx = pts.length - 1;
    const show = (i, cx, cy) => {
      idx = i; const p = pts[i];
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
      const lines = [{ key: "var(--pos)", text: `Cumulative R · ${p.id}` }];
      if (p.date) lines.push({ text: p.date });
      if (i > 0) lines.push({ text: `This trade ${fmtR(p.r)}` });
      showTip(fmtR(p.cum_r), lines, cx, cy);
    };
    const nearest = cx => { const b = root.getBoundingClientRect(); let best = 0, dist = Infinity;
      pts.forEach((_, i) => { const dd = Math.abs(b.left + X(i) - cx); if (dd < dist) { dist = dd; best = i; } }); return best; };
    hit.addEventListener("pointermove", e => show(nearest(e.clientX), e.clientX, e.clientY));
    hit.addEventListener("pointerleave", () => { hideTip(); cross.setAttribute("visibility", "hidden"); });
    const atPoint = i => { const b = root.getBoundingClientRect(); show(i, b.left + X(i), b.top + Y(pts[i].cum_r)); };
    hit.addEventListener("focus", () => atPoint(idx));
    hit.addEventListener("blur", () => { hideTip(); cross.setAttribute("visibility", "hidden"); });
    hit.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") { atPoint(Math.min(pts.length - 1, idx + 1)); e.preventDefault(); }
      if (e.key === "ArrowLeft") { atPoint(Math.max(0, idx - 1)); e.preventDefault(); }
    });

  });
}
const BIN_SHORT = ["< −1.1", "−1.1 to BE", "BE", "BE to 1", "1 to 2", "2 to 3", "≥ 3"];
const BIN_CLASS = ["bar-neg", "bar-neg", "bar-neutral", "bar-pos", "bar-pos", "bar-pos", "bar-pos"];
function columnPath(x, y, w, hgt, r = 4) {

}
function histogramChart(host, bins) {
  responsive(host, W => {
    const H = 240, m = { t: 20, r: 12, b: 44, l: 36 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const maxN = Math.max(1, ...bins.map(b => b.count)), yt = niceTicks(0, maxN, Math.min(4, maxN)).filter(v => Number.isInteger(v));
    const top = yt[yt.length - 1], band = iw / bins.length, bw = Math.min(24, band * 0.6);
    const Y = v => m.t + ih - v / top * ih;
    const root = s("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Distribution of trade results in R" });
    for (const v of yt) {
      root.append(s("line", { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), class: v === 0 ? "axis" : "grid" }));
      root.append(s("text", { x: m.l - 8, y: Y(v), "text-anchor": "end", "dominant-baseline": "middle" }, String(v)));
    }
    bins.forEach((b, i) => {
      const cx = m.l + band * i + band / 2, x = cx - bw / 2;
      const hit = s("rect", { x: m.l + band * i, y: m.t, width: band, height: ih, fill: "transparent", tabindex: 0, class: "bar-hit",
                              "aria-label": `${b.label}: ${b.count} trade${b.count === 1 ? "" : "s"}` });
      const tipAt = (cx2, cy2) => showTip(`${b.count} trade${b.count === 1 ? "" : "s"}`, [{ text: b.label }], cx2, cy2);
      hit.addEventListener("pointermove", e => tipAt(e.clientX, e.clientY));
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("focus", () => { const r = root.getBoundingClientRect(); tipAt(r.left + cx, r.top + Y(b.count)); });
      hit.addEventListener("blur", hideTip);
      root.append(hit);
      if (b.count > 0) {
        root.append(s("path", { d: columnPath(x, Y(b.count), bw, Y(0) - Y(b.count)), class: `bar-mark ${BIN_CLASS[i]}` }));
        root.append(s("text", { x: cx, y: Y(b.count) - 6, "text-anchor": "middle", class: "cap-label" }, String(b.count)));
      }
      const words = BIN_SHORT[i].split(" ");
      const label = s("text", { x: cx, y: H - m.b + 16, "text-anchor": "middle" });
      if (band < 58 && words.length > 1) {
        const mid = Math.ceil(words.length / 2);
        label.append(s("tspan", { x: cx, dy: 0 }, words.slice(0, mid).join(" ")), s("tspan", { x: cx, dy: 13 }, words.slice(mid).join(" ")));
      } else label.textContent = BIN_SHORT[i];
      root.append(label);
    });
    return root;
  });
}

  entry_models: "Entry models", entry_model: "Entry model", stop_model: "Stop model", target_model: "Target model",
  risk_model: "Risk model", leverage_model: "Leverage model", management: "Management", do_not_trade_when: "Do not trade when",
  common_mistakes: "Common mistakes", open_questions: "Open questions",
};
function ruleValue(v) {
  if (v === null || v === undefined) return unstated();
  if (Array.isArray(v)) return v.length ? list(v) : unstated("None stated");
  if (typeof v === "object") {
    const entries = Object.entries(v);
    if (!entries.length) return unstated("None stated");
    return h("dl", { class: "kv" }, entries.flatMap(([k, x]) => [h("dt", { text: titleCase(k) }), h("dd", {}, ruleValue(x))]));
  }
  return h("span", { text: String(v) });
}
function renderStrategy() {
  if (!KB.strategies.length) return card("Strategies", "No strategy recorded yet.");
  return h("div", { class: "stack" }, KB.strategies.map(st => {
    const meta = st.meta, cur = String(meta.current_version), rules = st.versions[cur] || {};
    const promo = st.promotion || {}, n = st.measured_trades.length;
    const skip = new Set(["version", "date", "source", "supersedes"]);
    const dl = h("dl", { class: "kv" }, Object.entries(rules).filter(([k]) => !skip.has(k))
      .flatMap(([k, v]) => [h("dt", { text: RULE_LABELS[k] || titleCase(k) }), h("dd", {}, ruleValue(v))]));
    const versions = Object.keys(st.versions).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
      .map(v => ({ v, date: st.versions[v].date, source: st.versions[v].source, current: v === cur }));
    return h("div", { class: "stack" },
      card(meta.name || st.slug, meta.summary,
        h("div", { class: "tiles" },
          tile("Status", titleCase(meta.status), meta.status === "unvalidated" ? "New strategy: not yet evidenced" : null),
          tile("Current version", "v" + cur, rules.date ? `Recorded ${rules.date}` : null),
          tile("Measured trades", String(n), n ? st.measured_trades.join(", ") : "None yet"),
          tile("Next status", promo.developing ? `${Math.min(n, promo.developing)} / ${promo.developing}` : "—",
               promo.developing ? `Developing needs ${promo.developing}, established ${promo.established}` : null)),
        h("h3", { text: `Rules · v${cur}` }), h("p", { class: "note", text: rules.source || "" }), dl),
      h("div", { class: "grid2" },
        card("Version history", "Committed versions are immutable. Old versions are kept so results can be compared.",
          table([{ label: "Version", render: r => "v" + r.v + (r.current ? " (current)" : "") }, { key: "date", label: "Date" },
                 { key: "source", label: "Source", wrap: true }], versions)),
        card("Change log", "Rule changes need evidence. Clarifications record rules the trader stated that were already in force.",
          table([{ key: "id", label: "ID" }, { label: "Kind", render: r => titleCase(r.kind || "rule_change") },
                 { label: "Status", render: r => titleCase(r.status || "") }, { key: "resulting_version", label: "Version" },
                 { label: "Detail", wrap: true, render: r => r.statement || r.proposed_change || r.observation || "—" }],
                st.changes, { empty: "No changes recorded." }))));
  }));
}

function renderRisk() {
  const p = KB.profile || {}, src = p.sources || {};
  const rows = [
    ["Risk per trade", "risk.risk_per_trade_pct", v => v + "% of equity"], ["Max risk per trade", "risk.max_risk_per_trade_pct", v => v + "% of equity"],
    ["Max daily loss", "risk.max_daily_loss_r", v => v + "R"], ["Max open risk", "risk.max_open_risk_pct", v => v + "% of equity"],
    ["Pause after consecutive losses", "risk.max_consecutive_losses_before_pause", v => String(v)],
    ["Max leverage", "leverage.max_leverage", v => v + "x"], ["Margin mode", "leverage.margin_mode", v => titleCase(v)],
    ["Maintenance margin rate", "leverage.maintenance_margin_rate", v => (v * 100).toFixed(2) + "%"],
    ["Maker fee", "fees.maker_rate", v => (v * 100).toFixed(3) + "%"], ["Taker fee", "fees.taker_rate", v => (v * 100).toFixed(3) + "%"],
    ["Account equity", "account.equity", v => fmtNum(v)],
  ].map(([label, path, f]) => ({ label, value: dig(p, path), f, source: src[path] }));
  const profileTable = table([{ key: "label", label: "Rule" },
    { label: "Value", render: r => r.value === null || r.value === undefined ? unstated("Unresolved") : r.f(r.value) },
    { label: "Source", wrap: true, render: r => r.source || "—" }], rows);

  const expRows = trades.filter(t => t.derived.exposure).map(t => ({ t, e: t.derived.exposure }));
  const expTable = table([
    { label: "Trade", render: r => h("button", { class: "linkish", type: "button", text: r.t.id, onclick: () => openTrade(r.t.id) }) },
    { label: "Asset", render: r => r.t.asset }, { label: "Stop distance", num: true, render: r => fmtPct(r.e.stop_pct) },
    { label: "Risk", num: true, render: r => fmtPct(dig(r.t, "risk.risk_pct"), 1) },
    { label: "Notional", num: true, render: r => isNum(r.e.notional_pct) ? fmtPct(r.e.notional_pct, 1) + " of equity" : "—" },
    { label: "Effective lev.", num: true, render: r => fmtX(r.e.effective_leverage) },
    { label: "Lev. setting", num: true, render: r => isNum(dig(r.t, "risk.leverage")) ? r.t.risk.leverage + "x" : "—" },
    { label: "Margin posted", num: true, render: r => isNum(r.e.margin_pct) ? fmtPct(r.e.margin_pct) + " of equity" : "—" },
    { label: "Liquidation (isolated)", num: true, render: r => isNum(r.e.liq_isolated) ? fmtNum(r.e.liq_isolated) + (r.e.liq_mode_assumed ? " *" : "") : "—" },
    { label: "Liq. / stop distance", num: true, render: r => fmtX(r.e.liq_to_stop) },
    { label: "Check", render: r => r.e.liq_before_stop ? badge("CRITICAL", "Liq. before stop") : isNum(r.e.liq_to_stop) ? badge("win", "Stop fires first") : "—" },
  ], expRows, { empty: "No trades with entry and stop yet." });

  return h("div", { class: "stack" },
    card("Risk rules", "Only what the trader has stated. Unresolved rules are gaps to fill, never defaults to assume.", profileTable),
    card("Exposure per trade", "Leverage is not risk. With a fixed % risk, the stop distance sets the position size; leverage only changes the margin posted and the liquidation distance. * = margin mode not recorded, isolated assumed.", expTable),
    card("Position calculator", "Sizes a position from risk and stop. Same formulas as ./tj size. Liquidation is an approximation: the exchange's figure is authoritative.", calculator()));
}

function calculator() {
  const p = KB.profile || {};
  const field = (label, attrs) => { const input = h("input", { type: "number", step: "any", inputmode: "decimal", ...attrs }); return [h("label", {}, label, input), input]; };
  const [lEq, eq] = field("Account equity", { value: dig(p, "account.equity") ?? "", placeholder: "e.g. 10000" });
  const [lRisk, risk] = field("Risk per trade (%)", { value: dig(p, "risk.risk_per_trade_pct") ?? "", placeholder: "1" });
  const [lEntry, entry] = field("Entry price", { placeholder: "90.41" });
  const [lStop, stop] = field("Stop price", { placeholder: "87.59" });
  const [lTp, tp] = field("Target price", { placeholder: "103.30" });
  const [lLev, lev] = field("Leverage setting (x)", { placeholder: "10" });
  const [lFee, fee] = field("Fee per side (%)", { value: isNum(dig(p, "fees.taker_rate")) ? p.fees.taker_rate * 100 : "", placeholder: "0.06" });
  const [lMmr, mmr] = field("Maintenance margin (%)", { value: isNum(dig(p, "leverage.maintenance_margin_rate")) ? p.leverage.maintenance_margin_rate * 100 : 0.5 });
  const mode = h("select", {}, ["isolated", "cross"].map(v => h("option", { value: v, text: titleCase(v) })));
  if (dig(p, "leverage.margin_mode")) mode.value = p.leverage.margin_mode;
  const out = h("div", {});
  const v = el => el.value === "" ? null : Number(el.value);
  const recalc = () => {
    out.replaceChildren();
    if ([entry, stop, eq, risk].some(el => v(el) === null)) { out.append(h("p", { class: "empty", text: "Enter equity, risk %, entry and stop." })); return; }
    try {
      const res = RiskMath.size({ entry: v(entry), stop: v(stop), riskAmount: v(eq) * v(risk) / 100, equity: v(eq), leverage: v(lev),
        marginMode: mode.value, mmrRate: (v(mmr) ?? 0.5) / 100, feeRate: (v(fee) ?? 0) / 100, targets: v(tp) === null ? [] : [v(tp)],
        maxRiskPct: dig(p, "risk.max_risk_per_trade_pct") ?? null, maxLeverage: dig(p, "leverage.max_leverage") ?? null });
      const rr = res.targets[0];
      out.append(h("div", { class: "tiles", style: "margin-top:12px" },
        tile("Side", titleCase(res.side), `Stop ${fmtPct(res.stopDistancePct)} from entry`),
        tile("Quantity", res.qty.toPrecision(6), "Base units"),
        tile("Notional", fmtNum(res.notional), `${fmtX(res.effectiveLeverage)} effective leverage`),
        tile("Loss at stop", fmtNum(res.lossAtStop), `${fmtPct(res.riskPct)} of equity, fees included`),
        tile("Margin posted", res.marginRequired === null ? "—" : fmtNum(res.marginRequired), v(lev) ? `At ${v(lev)}x` : "No leverage set"),
        tile("Liquidation", res.liquidation === null ? "—" : fmtNum(res.liquidation), res.liqToStop ? `${fmtX(res.liqToStop)} the stop distance` : null),
        tile("Reward : risk", rr ? rr.rrGross.toFixed(2) : "—", rr ? `${rr.rrNet.toFixed(2)} after fees` : "Add a target")));
      for (const [level, msg] of res.flags) out.append(h("div", { class: "flag" }, h("span", { class: "dot", style: `background:${STATUS[level][0]}` }), h("span", {}, h("strong", { text: STATUS[level][1] + ": " }), msg)));
    } catch (err) { out.append(h("div", { class: "flag" }, h("span", { class: "dot", style: "background:var(--critical)" }), err.message)); }
  };
  [eq, risk, entry, stop, tp, lev, fee, mmr, mode].forEach(el => el.addEventListener("input", recalc));
  recalc();
  return h("div", {}, h("div", { class: "calc" }, lEq, lRisk, lEntry, lStop, lTp, lLev, h("label", {}, "Margin mode", mode), lFee, lMmr), out);
}

function renderBehaviour() {
  const errs = KB.stats.errors, beh = KB.stats.behaviors;
  return h("div", { class: "stack" },
    card("Recurring errors", `Flagged as recurring at ${KB.config.recurring_error_min} occurrences. Treated as system-design problems, not character judgements.`,
      table([{ label: "Mistake", render: r => tagLabel("mistakes", r.tag) }, { key: "count", label: "Count", num: true },
             { key: "recent", label: "Recent", num: true }, { label: "Status", render: r => r.recurring ? badge("recurring") : "—" },
             { label: "R cost", num: true, render: r => `${fmtR(r.total_r)} (n=${r.n_measured})` }, { label: "Mean R", num: true, render: r => fmtR(r.mean_r) },
             { key: "last_seen", label: "Last seen" }, { label: "Trades", wrap: true, render: r => r.trades.join(", ") }], errs,
            { empty: "No mistakes recorded yet." })),
    card("Strong behaviours", "Mean R with and without each behaviour. This shows correlation, not cause.",
      table([{ label: "Behaviour", render: r => tagLabel("behaviors", r.tag) }, { key: "n_with", label: "n with", num: true },
             { label: "Mean R with", num: true, render: r => fmtR(r.mean_with) }, { key: "n_without", label: "n without", num: true },
             { label: "Mean R without", num: true, render: r => fmtR(r.mean_without) }], beh, { empty: "No behaviours recorded yet." })));
}

function renderGaps() {
  const issues = (KB.build && KB.build.validation) || [];
  const questions = KB.strategies.flatMap(st => ((st.versions[String(st.meta.current_version)] || {}).open_questions || []).map(q => ({ st: st.slug, q })));
  return h("div", { class: "stack" },
    card("Open questions", "What the system still needs from the trader before these rules can be automated.",
      questions.length ? list(questions.map(x => x.q)) : h("p", { class: "empty", text: "None open." })),
    card("Unresolved profile parameters", "Never assumed. Each one is filled only when the trader states it.", list(KB.unresolved, "All resolved.")),
    card("Validation", "Integrity checks from the last build.",
      table([{ label: "Level", render: r => badge(r.level) }, { key: "where", label: "Where" }, { key: "msg", label: "Detail", wrap: true }], issues,
            { empty: "No issues." })),
    card("Records not yet usable in statistics", null,
      table([{ key: "id", label: "Trade" }, { label: "Needs", wrap: true, render: r => r.needs.join(", ") }], KB.gaps.unmeasurable, { empty: "None: every closed trade has a measurable R." }),
      h("p", { class: "note", style: "margin-top:10px", text: KB.gaps.unreviewed.length ? `Closed trades without process scores: ${KB.gaps.unreviewed.join(", ")}` : "Every closed trade has process scores." })));
}

/* ---------- trade detail ---------- */
const dlg = document.getElementById("trade-dialog");
function kv(pairs) {
  return h("dl", { class: "kv" }, pairs.filter(Boolean).flatMap(([k, v]) => [h("dt", { text: k }), h("dd", {}, v === null || v === undefined || v === "" ? "—" : v instanceof Node ? v : String(v))]));
}
function openTrade(id) {
  const t = byId[id]; if (!t) return;
  const d = t.derived, e = d.exposure || {}, rv = t.review || {}, sc = rv.scores || {};
  const exits = (dig(t, "fills.exits") || []).map(x => `${fmtPrice(x.price)}${isNum(x.qty) ? " × " + x.qty : isNum(x.fraction) ? " × " + (x.fraction * 100) + "%" : ""}${x.reason ? " — " + x.reason : ""}`);
  const scoreRows = ["setup", "context", "execution", "risk", "management"].map(k =>
    h("div", { class: "score-row" }, h("span", { text: titleCase(k) }), isNum(sc[k]) ? meter(sc[k] / 5) : unstated("Not scored"), h("span", { class: "num", text: isNum(sc[k]) ? `${sc[k]}/5` : "—" })));
  const chartImgs = (dig(t, "evidence.charts") || []).filter(c => CHARTS[c]).map(c => {
    const img = h("img", { class: "chart-img", src: CHARTS[c], alt: `Chart for ${t.id}`, loading: "lazy" });
    img.addEventListener("click", () => { img.style.cursor = img.style.width ? "zoom-in" : "zoom-out"; img.style.width = img.style.width ? "" : "200%"; });
    return h("div", { style: "overflow:auto" }, img);
  });
  const result = t.status === "closed"
    ? `${fmtR(d.r)}${d.r_source ? " (" + d.r_source + ")" : ""}`
    : isNum(d.counterfactual_r) ? `${fmtR(d.counterfactual_r)} (counterfactual)` : "—";
  dlg.replaceChildren(
    h("div", { class: "dlg-head" },
      h("div", {}, h("h2", { id: "dlg-title", text: `${t.id} · ${t.asset || "—"} ${t.direction ? titleCase(t.direction) : ""}` }),
        h("div", { style: "display:flex;gap:6px;flex-wrap:wrap;margin-top:6px" }, tradeBadge(t), d.label ? h("span", { class: "badge", text: d.label }) : null)),
      h("button", { class: "btn", type: "button", text: "Close", onclick: () => dlg.close() })),
    h("div", { class: "dlg-body stack" },
      h("div", { class: "grid2" },
        card("Trade", null, kv([["Opened", t.opened], ["Closed", t.closed], ["Held", isNum(d.holding_days) ? `${d.holding_days} days` : null],
          ["Market", t.market], ["Session", t.session], ["Timeframes", `HTF ${dig(t, "timeframes.htf") || "—"} · execution ${dig(t, "timeframes.execution") || "—"}`],
          ["Strategy", strategyLabel(t)], ["Entry model", dig(t, "plan.entry_model") ? titleCase(t.plan.entry_model) : null],
          ["Setups", tags(t.setups, "setups")], ["Regime", tags(t.regime, "regimes")]])),
        card("Plan and result", null, kv([["Entry", fmtPrice(dig(t, "plan.entry"))], ["Stop (initial)", fmtPrice(dig(t, "plan.stop"))],
          ["Targets", (dig(t, "plan.targets") || []).map((x, i) => `${fmtPrice(x)}${isNum((d.planned_rr || [])[i]) ? " (" + d.planned_rr[i].toFixed(2) + "R)" : ""}`).join(", ")],
          ["Invalidation", dig(t, "plan.invalidation")], ["Exits", exits.length ? list(exits) : null], ["Fees", fmtNum(dig(t, "fills.fees"))],
          ["Result", result], ["PnL", fmtNum(d.pnl)]]))),
      h("div", { class: "grid2" },
        card("Risk decomposition", "Leverage changes margin and liquidation distance, not the loss at stop.", kv([
          ["Stop distance", fmtPct(e.stop_pct)], ["Risk", isNum(dig(t, "risk.risk_pct")) ? t.risk.risk_pct + "% of equity" : null],
          ["Notional", isNum(e.notional_pct) ? fmtPct(e.notional_pct, 1) + " of equity" : null], ["Effective leverage", fmtX(e.effective_leverage)],
          ["Leverage setting", isNum(dig(t, "risk.leverage")) ? t.risk.leverage + "x" : null], ["Margin mode", dig(t, "risk.margin_mode") || unstated("Not recorded")],
          ["Margin posted", isNum(e.margin_pct) ? fmtPct(e.margin_pct) + " of equity" : null],
          ["Liquidation", isNum(e.liq_isolated) ? `${fmtNum(e.liq_isolated)} (isolated${e.liq_mode_assumed ? ", assumed" : ""}), ${fmtPct(e.liq_distance_pct)} away, ${fmtX(e.liq_to_stop)} the stop distance` : null]])),
        card("Confluences and confirmations", null, h("h3", { text: "Confluences" }), list(dig(t, "plan.confluences")),
          h("h3", { text: "Confirmations" }), list(dig(t, "plan.confirmations")))),
      card("Decision journal", "Before is the thesis at the time of the decision. It is kept separate from what was learned afterwards.",
        h("h3", { text: "Before" }), h("p", { class: "prose", text: dig(t, "journal.before") || "—" }),
        h("h3", { text: "During" }), h("p", { class: "prose", text: dig(t, "journal.during") || "—" }),
        h("h3", { text: "After" }), h("p", { class: "prose", text: dig(t, "journal.after") || "—" })),
      card("Evidence", "Facts, readings of those facts, and untested ideas, kept apart.",
        h("h3", { text: "Observed" }), list(dig(t, "evidence.observed")), h("h3", { text: "Interpreted" }), list(dig(t, "evidence.interpreted")),
        h("h3", { text: "Hypotheses" }), list(dig(t, "evidence.hypotheses"))),
      card("Review", d.process_mean ? `Process mean ${d.process_mean.toFixed(2)} / 5 → ${d.grade}` : "Process not yet scored.", ...scoreRows,
        kv([["Setup validity", rv.setup_validity], ["Followed plan", rv.followed_plan === null || rv.followed_plan === undefined ? null : rv.followed_plan ? "Yes" : "No"],
          ["Loss type", rv.loss_type ? `${rv.loss_type} · ${tagLabel("loss_types", rv.loss_type)}` : null],
          ["Mistakes", tags(rv.mistakes, "mistakes")], ["Behaviours", tags(rv.behaviors, "behaviors")], ["Outside control", list(rv.outside_control)],
          ["Lesson", rv.lesson], ["Actionable change", rv.actionable_change], ["Strategy change", rv.strategy_change], ["Evidence strength", rv.evidence_strength]])),
      chartImgs.length ? card("Chart", "Click to zoom.", ...chartImgs) : null));
  dlg.showModal();
  dlg.scrollTop = 0;
}
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

/* ---------- shell ---------- */
const PANELS = [["overview", "Overview", renderOverview], ["journal", "Journal", renderJournal], ["performance", "Performance", renderPerformance],
                ["strategy", "Strategy", renderStrategy], ["risk", "Risk", renderRisk], ["behaviour", "Behaviour", renderBehaviour], ["gaps", "Data gaps", renderGaps]];
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } } };
const tabs = document.getElementById("tabs"), main = document.getElementById("main"), rendered = {};
function select(id) {
  if (!PANELS.some(p => p[0] === id)) id = "overview";
  for (const [pid, , fn] of PANELS) {
    const btn = document.getElementById("tab-" + pid), panel = document.getElementById("panel-" + pid);
    const on = pid === id;
    btn.setAttribute("aria-selected", on); btn.tabIndex = on ? 0 : -1; panel.classList.toggle("active", on);
    if (on && !rendered[pid]) { panel.append(fn()); rendered[pid] = true; }
  }
  store.set("tj-tab", id);
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
for (const [id, label] of PANELS) {
  tabs.append(h("button", { id: "tab-" + id, role: "tab", type: "button", "aria-controls": "panel-" + id, text: label, onclick: () => select(id) }));
  main.append(h("section", { id: "panel-" + id, class: "panel", role: "tabpanel", "aria-labelledby": "tab-" + id }));
}
tabs.addEventListener("keydown", e => {
  const ids = PANELS.map(p => p[0]), cur = ids.indexOf(document.activeElement.id.replace("tab-", ""));
  if (cur < 0 || !["ArrowRight", "ArrowLeft"].includes(e.key)) return;
  const next = ids[(cur + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
  select(next); document.getElementById("tab-" + next).focus();
});
window.addEventListener("hashchange", () => select(location.hash.slice(1)));

const themeBtn = document.getElementById("theme-btn");
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  themeBtn.textContent = dark ? "Light mode" : "Dark mode";
}
themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark"; store.set("tj-theme", next); applyTheme(next);
});
applyTheme(store.get("tj-theme"));

const strat = KB.strategies[0];
document.getElementById("brand-sub").textContent = [
  strat ? `${strat.meta.name || strat.slug} · v${strat.meta.current_version} · ${titleCase(strat.meta.status)}` : "No strategy recorded",
  `${KB.phase.name} ${KB.phase.measured}/${KB.phase.target}`].join("  ·  ");
document.getElementById("footer").textContent =
  `Built ${KB.build.generated_at} · fingerprint ${KB.fingerprint} · schema v${KB.schema_version} · source of truth: journal/trades/*.yaml · rebuild with ./tj build · machine-readable copy: exports/kb.json`;
select(location.hash.slice(1) || store.get("tj-tab") || "overview");
</script>
</body>
</html>
