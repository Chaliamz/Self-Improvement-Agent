/* backgrounds: one decorative layer at a time, chosen in the header. Never over the data. */
body { position: relative; isolation: isolate; }
#bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; opacity: var(--bg-opacity); }
#bg > * { position: absolute; inset: 0; display: none; }

:root[data-bg-kind="canvas"] #bg #bg-canvas,

:root[data-bg="nebula"] #bg .bg-nebula,
:root[data-bg="synthwave"] #bg .bg-synth,

  animation: grid-pan 60s linear infinite; }
.bg-static { background: radial-gradient(60% 50% at 15% 10%, var(--glow-brand), transparent 70%), radial-gradient(50% 40% at 90% 90%, var(--glow-accent), transparent 70%); }
/* aurora: three soft blobs on independent orbits; the teal/red one leans with net R */
.bg-aurora { filter: blur(48px); }
.bg-aurora i { position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%; }
.bg-aurora i:nth-child(1) { left: -12vmax; top: -18vmax; background: radial-gradient(circle, var(--glow-brand), transparent 65%); animation: orbit-a 28s ease-in-out infinite alternate; }
.bg-aurora i:nth-child(2) { right: -14vmax; bottom: -20vmax; background: radial-gradient(circle, var(--glow-up), transparent 65%); animation: orbit-b 34s ease-in-out infinite alternate; }
:root[data-pnl="down"] .bg-aurora i:nth-child(2) { background: radial-gradient(circle, var(--glow-down), transparent 65%); }
.bg-aurora i:nth-child(3) { left: 30vw; top: 20vh; width: 42vmax; height: 42vmax; background: radial-gradient(circle, var(--glow-accent), transparent 65%); animation: orbit-c 41s ease-in-out infinite alternate; }
@keyframes orbit-a { to { transform: translate3d(22vw, 16vh, 0) scale(1.15); } }

.bg-synth { background: linear-gradient(to bottom, transparent 30%, var(--glow-brand) 55%, transparent 56%); }
.bg-synth .sun { position: absolute; left: 50%; top: 20%; width: 34vmin; height: 34vmin; transform: translateX(-50%); border-radius: 50%;
  background: linear-gradient(to bottom, var(--brand), var(--down)); opacity: .28;
  -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 13px); mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 13px);
  animation: sun-pulse 6s ease-in-out infinite alternate; }

  background-image: linear-gradient(var(--brand) 1px, transparent 1px), linear-gradient(90deg, var(--brand) 1px, transparent 1px); background-size: 56px 56px; opacity: .22;

.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 12px; }

ol.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--grid); }
ol.checklist li:first-child { border-top: 0; }
ol.checklist .box { flex: none; width: 18px; height: 18px; margin-top: 1px; border: 2px solid var(--brand); border-radius: 5px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
footer { color: var(--muted); font-size: 12px; padding: 16px 0 32px; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
@media (max-width: 600px) { .hero .value { font-size: 44px; } .kv { grid-template-columns: 1fr; gap: 2px 0; } .kv dd { margin-bottom: 8px; } }

igh (green \"CH\" line), so no bullish CHoCH yet. Equal lows formed at 89.36 =\ninducement (liquidity resting below). Price then broke the last lower high: structure bearish ->\nbullish. Noted the wick + higher low at the yellow line as a potential level.\nPlan: long at the extreme demand level (red box). That entry was missed (not at home; see T-0002).\nPrice swept the equal lows into the extreme demand zone, then reclaimed the 89.36 line (former\ninducement) as support. Took the long on that reclaim with TP at the yellow line.\n","during":"Held 2026-04-20 to 2026-05-10 through choppy conditions (trader's words).\n","after":"Trader, 2026-09-26: \"Entry to SL range (invalidation) was 3,14% so I used 10x leverage\", 1% risk.\nThe chart levels (90.41 / 87.59) give 3.12%; the 0.02-point gap is unexplained (actual fill?).\nStop placement (trader): \"the liquidity level which reclaimed support level from left ... in case\nprice would reverse back there and prices moves lower or enters a consolidation phase.\"\nLeverage check (trader): 3.14% x 10x = 31.4% loss on margin at the stop, inside the 50% rule.\nTP hit. Trader stated R:R 4.57. Trader stated the method: supply/demand levels + price action /\nmarket structure, with liquidity levels as confluences; asked for these to be memorised.\n"},"evidence":{"observed":["BloFin AAVE/USDT perpetual, 4H. Position tool: entry 90.41, stop 87.59, target 103.30 (labelled).","(103.30 - 90.41) / (90.41 - 87.59) = 4.57 via tj: matches the trader's stated R:R.","Lower low about 85.7 on Apr 7-8, the base of the red box (about 85.6 to 88.05).","Reversal on Apr 8 stayed below the green CH line (about 97.9); no close above it until Apr 13-14.","Equal lows around 89.0 to 89.4 on Apr 9-13 (red line 89.36). One wick about 88.75 near Apr 13 dipped below the line before the CHoCH.","Apr 14 candles: bodies topped about 103.2, wick about 104.05. Apr 17 lower wick about 103.0. The yellow line (about 103.3) sits across both.","Rally to above 115 on A <script>
"use strict";

const KB = JSON.parse(document.getElementById("kb-data").textContent);
const CHARTS = JSON.parse(document.getElementById("kb-charts").textContent) || {};

/* ---------- DOM helpers: every piece of data enters the DOM as text, never as HTML ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, text) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

/* ---------- formatting ---------- */
const MINUS = "−";
const isNum = x => typeof x === "number" && isFinite(x);
const fmtR = x => !isNum(x) ? "—" : (x > 0 ? "+" : x < 0 ? MINUS : "") + Math.abs(x).toFixed(2) + "R";
const fmtFrac = (x, d = 0) => !isNum(x) ? "—" : (x * 100).toFixed(d) + "%";
const fmtPct = (x, d = 2) => !isNum(x) ? "—" : x.toFixed(d) + "%";
const fmtNum = (x, d = 2) => !isNum(x) ? "—" : x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPrice = x => !isNum(x) ? "—" : String(x);
const fmtX = x => !isNum(x) ? "—" : x.toFixed(2) + "x";
const fmtCI = ci => !ci ? "—" : `[${fmtR(ci[0])}, ${fmtR(ci[1])}]`;
const fmtTick = x => (x > 0 ? "+" : x < 0 ? MINUS : "") + (Number.isInteger(x) ? Math.abs(x) : Math.abs(x).toFixed(1)) + "R";
const titleCase = str => String(str).replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
const tagLabel = (tax, tag) => ((KB.taxonomy[tax] || {})[tag] || {}).label || titleCase(tag);

const STATUS = {
  win: ["var(--up)", "▲ Win"], loss: ["var(--down)", "▼ Loss"], breakeven: ["var(--neutral)", "● Breakeven"],
  long: ["var(--up)", "▲ Long"], short: ["var(--down)", "▼ Short"], done: ["var(--up)", "✓ Done"], active: ["var(--brand)", "In progress"], locked: ["var(--neutral)", "Locked"],
  missed: ["var(--neutral)", "○ Missed"], not_taken: ["var(--neutral)", "○ Not taken"],
  planned: ["var(--brand)", "◇ Planned"], open: ["var(--warning)", "◐ Open"],
  CRITICAL: ["var(--critical)", "Critical"], ERROR: ["var(--critical)", "Error"], WARN: ["var(--warning)", "Warning"],
  INFO: ["var(--neutral)", "Info"], recurring: ["var(--serious)", "Recurring"],
};
function badge(key, label) {
  const [color, text] = STATUS[key] || ["var(--neutral)", titleCase(key)];
  return h("span", { class: "badge" }, h("span", { class: "dot", style: `background:${color}` }), label || text);
}
const unstated = (text = "Unstated") => h("span", { class: "badge unstated", text });
const tone = x => !isNum(x) || Math.abs(x) < 1e-12 ? null : x > 0 ? "up" : "down";
const rSpan = x => h("span", { class: tone(x), text: fmtR(x) });
const dirBadge = d => d === "long" || d === "short" ? badge(d) : "—";
function tradeBadge(t) {
  if (t.status === "closed") return t.derived.outcome ? badge(t.derived.outcome) : badge("INFO", "No R");
  return badge(t.status);
}
function tile(label, value, sub, toneKey) {
  return h("div", { class: "tile", "data-tone": toneKey || null }, h("div", { class: "t-label", text: label }), h("div", { class: "t-value", text: value }),
           sub ? h("div", { class: "t-sub", text: sub }) : null);
}
function card(title, note, ...kids) {
  return h("div", { class: "card" }, title ? h("h2", { text: title }) : null, note ? h("p", { class: "note", text: note }) : null, ...kids);
}
function meter(frac) {
  return h("div", { class: "meter-bar", role: "meter", "aria-valuemin": 0, "aria-valuemax": 100,
                    "aria-valuenow": Math.round(frac * 100) }, h("span", { style: `width:${Math.max(0, Math.min(1, frac)) * 100}%` }));
}
function table(cols, rows, opts = {}) {
  const thead = h("thead", {}, h("tr", {}, cols.map(c => h("th", { class: c.th || (c.num ? "num" : null), scope: "col", text: c.label, title: c.title || null }))));
  const tbody = h("tbody", {}, rows.map(r => {
    const tr = h("tr", { class: [opts.onRow ? "clickable" : "", opts.rowClass ? opts.rowClass(r) || "" : ""].join(" ").trim() || null },
      cols.map(c => {
        const v = c.render ? c.render(r) : r[c.key];
        return h("td", { class: [c.num ? "num" : "", c.wrap ? "wrap-cell" : "", c.td || ""].join(" ").trim() || null },
                 v instanceof Node ? v : (v === null || v === undefined || v === "" ? "—" : String(v)));
      }));
    if (opts.onRow) tr.addEventListener("click", e => { if (!e.target.closest("button")) opts.onRow(r); });
    return tr;
  }));
  if (!rows.length) tbody.append(h("tr", {}, h("td", { colspan: cols.length, class: "empty", text: opts.empty || "No data yet." })));
  return h("div", { class: "table-wrap" }, h("table", {}, thead, tbody));
}
function list(items, empty = "None recorded.") {
  if (!items || !items.length) return h("p", { class: "empty", text: empty });
  return h("ul", { class: "clean" }, items.map(i => h("li", {}, i instanceof Node ? i : String(i))));
}
function tags(items, tax) {
  if (!items || !items.length) return "—";
  return h("span", {}, items.map(t => h("span", { class: "tag", text: tax ? tagLabel(tax, t) : String(t) })));
}

/* ---------- motion: count-up, background tape, ambient state ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el, target) {
  if (reduceMotion || !isNum(target)) return;
  const t0 = performance.now(), dur = 900;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmtR(target * e); if (k < 1) requestAnimationFrame(step); else el.textContent = fmtR(target); };
  requestAnimationFrame(step);
}
function backgroundTape() {
  const host = document.getElementById("bg-tape");
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const n = 110, w = 10, gap = 8, H = 400, candles = [];
  let price = 100;
  for (let i = 0; i < n; i++) {
    const open = price, close = open * (1 + (rnd() - 0.48) * 0.06);
    const high = Math.max(open, close) * (1 + rnd() * 0.02), low = Math.min(open, close) * (1 - rnd() * 0.02);
    candles.push({ open, close, high, low }); price = close;
  }
  const lo = Math.min(...candles.map(c => c.low)), hi = Math.max(...candles.map(c => c.high));
  const Y = v => H - 20 - (v - lo) / (hi - lo) * (H - 40);
  const make = () => {
    const svgEl = s("svg", { viewBox: `0 0 ${n * (w + gap)} ${H}`, preserveAspectRatio: "none" });
    candles.forEach((c, i) => {
