# Trader profile: the parameters the agent must LEARN from the trader.
#
# null = UNRESOLVED. `./tj status` lists every null here on every session.
# Fill a value only when the trader states it; record where it came from in
# `sources`. Never infer a risk limit from a single trade.
#
# Units: *_pct fields are PERCENT (1.0 = 1%). *_rate fields are DECIMAL (0.0005 = 5 bps).

account:
  base_currency: null
  equity: null
  equity_as_of: null

risk:
  risk_per_trade_pct: 1.0             # normal risk per trade
  max_risk_per_trade_pct: 1.0         # hard ceiling; validator and `tj size` flag breaches
  max_daily_loss_r: "none"            # trader: "there's no stopping we stick to the plan"
  max_open_risk_pct: "none"           # trader: "only 1% risk we ignore frequency" (1% per trade, no cap on open trades)
  max_consecutive_losses_before_pause: "none"   # trader: "there's no pause"
  min_rr: 2.5                         # hard floor for the best target (trader: '1:2,5RR as well')
  preferred_rr: 3.0                   # 'I prefer hunting 1:3RR minimum'
  fees_inside_risk: true              # 'Everything is inside them' (fees within the 1%); the bot counts them separately

leverage:
  max_leverage: "none"                # no fixed cap: leverage is set from the stop distance by the margin rule below
  margin_mode: isolated               # isolated | cross
  max_margin_loss_at_stop_pct: 50     # TARGET: stop distance % x leverage (isolated margin)
  margin_loss_tolerance_pct: 55       # accepted above the target: "it's okay if it goes to 55% or something"
  margin_call_at_margin_loss_pct: 80  # "margin call occurs on 80%" (trader)
  maintenance_margin_rate: null       # decimal; exchange/tier specific

fees:
  maker_rate: null
  taker_rate: null

instruments:                          # list of markets/assets traded
  - "AAVEUSDT perpetual (BloFin)"
  - "SOLUSDT perpetual (BTCC)"
  - "PENGUUSDT perpetual (BloFin)"
  - "HYPEUSDT perpetual (Bybit)"
  - "S&P 500 index CFD, SPX500 (Capital.com)"
  - "POLUSDT perpetual (BloFin)"
sessions: null                        # the trader's own session names
timeframes:                           # notation: m minutes, h hours, D days, W weeks, M months
  swing:
    structure: "4h"                   # T-0001
    execution: "4h"                   # T-0001
    execution_ltf: "1h"               # T-0006: 4h zone, 1h CH, reclaim, retest and entry
  scalp:
    structure: "30m-1h"               # bias and structure (trader, 2026-09-27)
    key_levels: "15m"                 # key levels + liquidity
    execution: "1m-5m"                # confirmations; T-0003 was 1m (trader writes M for minutes)
  intraday:
    key_levels: "4h"                  # T-0004: "Major key level 4H"
    confirmation: "15m-30m"           # T-0004 lesson: the 30m must confirm a 5m CHoCH
    execution: "5m"

# How the trader grades setups (2026-09-27).
grading:
  scale: [S, A, B, C, D]
  tradeable: [S, A, B]                # "we can consider trading S,A,B,C trading setups"
  maybe: [C]                          # "We would avoid D setups and maybe C ones as well"
  avoid: [D]
  s_rr_guide: 3.5                     # a rough guide, not a floor: "it could be slightly less"
  s_criteria: "Proper confluences, clear confirmations, sniper entries leading to TP and a high RR (3.5RR and higher)."
  separated_by: "The quality of the setup (trader, 2026-09-27)."
  a_criteria: "A good setup executed well, one step short of S: a better entry or a stronger target would have made it S (T-0001, T-0006)."
  b_criteria: null                    # not yet stated
  c_criteria: "A setup taken without the full process, 'regardless of win' (T-0003: only the 1m timeframe)."
  d_criteria: "A poor trade plus a mistake: 'D would definitely be a poor trade+mistake'."
  examples: {T-0001: A, T-0003: C, T-0006: A, T-0007: S}

# News filter (trader, 2026-09-27). Applies to NEW entries only: open trades are kept.
news_filter:
  source: "ForexFactory economic calendar (forexfactory.com)"
  currencies: [USD]
  impact: high                        # the red symbols only
  no_new_entries_before_minutes: 60   # "we avoid macroeconomic data 1 Hour before event occurs"
  applies_to_open_trades: false       # "This is true only if we didn't enter the trade yet"
  resume_after_minutes: null          # not yet stated

# Automation venue (trader, 2026-09-27).
execution_venue:
  exchange: "MEXC"                    # "I'm expecting to use MEXC as an exchange to use the bot placing orders"

# How the trader analyses, in their words.
process:
  top_down: >-
    Top Down Analysis: start from a main (higher) timeframe, zoom into lower timeframes to identify
    key levels, and go to the lowest timeframes for execution (trader, 2026-09-26). More examples to come.

# The trader's own terms, in their words. These win over generic taxonomy labels.
terminology:
  CHoCH: "Change of character. Bullish CHoCH requires a candle CLOSE above the last lower high."
  inducement: "Equal lows = liquidity resting below."
  extreme demand level: "The red box: the full wick-to-wick range of the candle at the lower low that formed massive volume and a point of interest."
  extreme supply level: "Mirror of extreme demand, at the higher high."
  POI: "Point of interest."
  invalidation %: "Distance from entry to stop, in percent."
  lower low: "A candle must CLOSE below the previous low (its wick). Vice versa for a higher high."
  reclaim: "Price back above a swept level, holding it as support; secondary entry."
  confluences: "Liquidity sweep; strong bullish momentum + volume; inducement; potential resistance level."
  confirmations: "Bullish Reversal (4H); extreme demand level."
  Top Down Analysis: "Main timeframe first, then lower timeframes for key levels, then the lowest timeframes for execution."
  HTF / LTF: "Higher timeframe / lower timeframe."
  key level: "Support/resistance drawn from a wick; valid after multiple reactions."
  deviation: "Price moves through a level and fails to hold: a fakeout."
  retest: "Price returns to a broken level and tests it from the other side."
  reclaim-retest-accept: "Long sequence: level reclaimed, retested from above, and held."
  CH: "The trader's chart label for CHoCH."
  I became the liquidity: "My stop sat in the liquidity that price swept before reversing (T-0004)."
  divergence: "Regular bullish: price LL, RSI HL. Regular bearish: price HH, RSI LH. Hidden bullish: price HL, RSI LL. Hidden bearish: price LH, RSI HH. Just a confluence; the higher the timeframe, the stronger."
  supply/demand level: "Drawn where price created a CH (bearish: supply, bullish: demand), stronger with an FVG: 'we draw supply demand levels which form a FVG +CH'."
  mitigation: "Price returning into a supply/demand level. Unmitigated = high probability; the more it mitigates, the weaker it becomes. T-0007's supply is the example; a zone traded through and reclaimed with a CH is a reclaim level, not mitigation (T-0006)."
  FVG: "Fair value gap. Strengthens the supply/demand level whose move left it."
  inducement: "Equal highs/lows resting liquidity. 'AVOID Inducements at all costs'."
  level validity: "S/R levels and trendlines: at least 3 reactions preferred. Not for S/D levels (fewer mitigations = stronger)."
  reaction: "Not knowable in advance: a level is key if traders react to it. A touch that rejects, a break-retest-continue, or a deviation (break, retest, fail, level lost again). Mostly deviations, so the retest is traded for continuation."
  equal highs/lows: "No fixed tolerance; they may take longer to form. Still a liquidity level likely to be swept."
  potential CH (30m): "A 30m candle closes below the previous bullish 30m candle's low (bearish), or above the previous bearish 30m candle's high (bullish)."
  S setup: "Proper confluences, clear confirmations, a sniper entry that runs to TP, and a high R:R (about 3.5R; a rough guide) (trader, 2026-09-27). T-0007."
  grades: "S, A, B, C, D. S-B tradeable, C maybe, D avoided. A-D criteria not yet stated."
  4H candle range: "The range of the impulsive candle that made the high/low (cyan lines). Inside it = consolidation. A pullback must CLOSE beyond its opposite end."
  NOT CH: "A break of a level inside a candle range. Consolidation, not a change of character (T-0008)."
  pullback: "From a high, price must break and CLOSE below the low of the candle range, read on the HTF (4h); otherwise it is consolidation. A 1h pullback inside a 4h candle range is not a 4h pullback (trader, T-0008)."
  counter-trend: "Trading against the HTF trend (T-0007: short at ATH levels). Graded like any other setup; just a bit riskier (trader, 2026-09-27)."

