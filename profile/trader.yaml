# Trader profile: the parameters the agent must LEARN from the trader.
#
# null = UNRESOLVED. `./tj status` lists every null here on every session.
# Fill a value only when the trader states it; record where it came from in
# `sources`. Never infer a risk limit from a single trade.
#
# Units: *_pct fields are PERCENT (1.0 = 1%). *_rate fields are DECIMAL (0.0005 = 5 bps).

account:
  base_currency: null
  equity: null
  equity_as_of: null

risk:
  risk_per_trade_pct: 1.0             # normal risk per trade
  max_risk_per_trade_pct: 1.0         # hard ceiling; validator and `tj size` flag breaches
  max_daily_loss_r: null
  max_open_risk_pct: null             # aggregate risk across open positions
  max_consecutive_losses_before_pause: null
  min_rr: 2.5                         # hard floor for the best target (trader: '1:2,5RR as well')
  preferred_rr: 3.0                   # 'I prefer hunting 1:3RR minimum'

leverage:
  max_leverage: null
  margin_mode: isolated               # isolated | cross
  max_margin_loss_at_stop_pct: 50     # stop distance % x leverage must not exceed this (isolated margin)
  maintenance_margin_rate: null       # decimal; exchange/tier specific

fees:
  maker_rate: null
  taker_rate: null

instruments:                          # list of markets/assets traded
  - "AAVEUSDT perpetual (BloFin)"
  - "SOLUSDT perpetual (BTCC)"
sessions: null                        # the trader's own session names
timeframes:                           # notation: m minutes, h hours, D days, W weeks, M months
  swing:
    structure: "4h"                   # T-0001
    execution: "4h"
  scalp:
    structure: null                   # T-0003 used no higher timeframe; to be learned from top-down examples
    execution: "1m"                   # T-0003 (trader wrote "1M"; the chart interval is 1 minute)

# How the trader analyses, in their words.
process:
  top_down: >-
    Top Down Analysis: start from a main (higher) timeframe, zoom into lower timeframes to identify
    key levels, and go to the lowest timeframes for execution (trader, 2026-09-26). More examples to come.

# The trader's own terms, in their words. These win over generic taxonomy labels.
terminology:
  CHoCH: "Change of character. Bullish CHoCH requires a candle CLOSE above the last lower high."
  inducement: "Equal lows = liquidity resting below."
  extreme demand level: "The red box: the full wick-to-wick range of the candle at the lower low that formed massive volume and a point of interest."
  extreme supply level: "Mirror of extreme demand, at the higher high."
  POI: "Point of interest."
  invalidation %: "Distance from entry to stop, in percent."
  lower low: "A candle must CLOSE below the previous low (its wick). Vice versa for a higher high."
  reclaim: "Price back above a swept level, holding it as support; secondary entry."
  confluences: "Liquidity sweep; strong bullish momentum + volume; inducement; potential resistance level."
  confirmations: "Bullish Reversal (4H); extreme demand level."
  Top Down Analysis: "Main timeframe first, then lower timeframes for key levels, then the lowest timeframes for execution."
  HTF / LTF: "Higher timeframe / lower timeframe."
  key level: "Support/resistance drawn from a wick; valid after multiple reactions."
  deviation: "Price moves through a level and fails to hold: a fakeout."
  retest: "Price returns to a broken level and tests it from the other side."
  reclaim-retest-accept: "Long sequence: level reclaimed, retested from above, and held."

# Where each resolved value came from: {path: "stated 2026-09-26 in T-0003 review"}
sources:
  instruments: "T-0001 chart (BloFin AAVE/USDT perp), 2026-09-26"
  timeframes.swing.structure: "Trader: 'chart time frame is 4H', 2026-09-26"
  terminology: "Trader's T-0001 message, 2026-09-26"
  risk.risk_per_trade_pct: "Trader: 'Risk management always goes to 1%', 2026-09-26"
  risk.max_risk_per_trade_pct: "Inferred from 'always 1%': fixed risk means 1% is also the ceiling. Confirm."
  timeframes.swing.execution: "Trader: '5) 4h', 2026-09-26"
  timeframes.scalp.execution: "Trader: 'Time execution: 1M' (1-minute chart), T-0003"
  process.top_down: "Trader: 'memorize Top Down analysis', 2026-09-26"
  leverage.margin_mode: "Trader: 'which means I use an isolated margin', 2026-09-26"
  leverage.max_margin_loss_at_stop_pct: "Trader: 'leverage planning not to exceed -50%', 2026-09-26"
  risk.min_rr: "Trader: 'I could enter a trade with 1:2,5RR as well', 2026-09-26"
  risk.preferred_rr: "Trader: 'I prefer hunting 1:3RR minimum', 2026-09-26"
