# Canonical setup tags (system prompt §4).
#
# The trader's terminology wins. When they introduce a term, add it here as a
# NEW tag in their words (with introduced_in: T-xxxx and their definition)
# rather than forcing it into a generic label. Use `aliases` only for true
# synonyms; records must use the canonical tag (the validator enforces this).

tags:
  breakout:               {label: Breakout}
  breakout_retest:        {label: Breakout retest}
  liquidity_sweep:        {label: Liquidity sweep}
  liquidity_grab:         {label: Liquidity grab}
  mean_reversion:         {label: Mean reversion}
  trend_continuation:     {label: Trend continuation}
  trend_reversal:         {label: Trend reversal}
  pullback:               {label: Pullback}
  momentum_continuation:  {label: Momentum continuation}
  range_trade:            {label: Range trade}
  sr_reaction:            {label: Support/resistance reaction}
  failed_breakout:        {label: Failed breakout}
  market_structure_shift: {label: Market structure shift}
  other:                  {label: Other (describe in journal; promote to its own tag once it recurs)}

  # --- Trader's own terms (introduced with T-0001, 2026-09-26) ---
  choch:
    label: CHoCH (change of character)
    aliases: [ch]                # the trader labels it "CH" on charts
    definition: "Bullish CHoCH requires a candle CLOSE above the last lower high; a wick through does not count."
    introduced_in: T-0001
  inducement:
    label: Inducement
    definition: "Equal lows = liquidity resting below (equal highs: above). A confluence only when price sweeps it into the zone. 'AVOID Inducements at all costs': never enter at one (trader, 2026-09-27)."
    introduced_in: T-0001
  extreme_demand:
    label: Extreme demand level
    definition: "The red box: the full wick-to-wick range of the candle at the lower low that formed massive volume and a point of interest (trader, 2026-09-26)."
    introduced_in: T-0001
  reclaim:
    label: Reclaim (support reclaim)
    definition: "Price closes back above a level it swept (in T-0001 the former inducement / equal lows) and holds it as support. Used as a secondary entry."
    introduced_in: T-0001
  extreme_supply:
    label: Extreme supply level
    definition: "Mirror of extreme demand: the full wick-to-wick range of the high-volume candle at the higher high."
    introduced_in: "trader statement 2026-09-26 (rules mirror for shorts)"
  key_level:
    label: Key level (S/R)
    definition: "Support/resistance level (or trendline) drawn from a wick. Valid after multiple reactions, at least 3 preferred (trader, T-0003 and 2026-09-27)."
    introduced_in: T-0003
  deviation:
    label: Deviation (fakeout)
    definition: "Price moves through a level and fails to hold beyond it (trader's words: 'deviation/fakeout')."
    introduced_in: T-0003
  retest:
    label: Retest
    definition: "Price returns to a level it just broke or lost and tests it from the other side."
    introduced_in: T-0003
  divergence:
    label: RSI divergence
    definition: "Regular bullish: price lower low, RSI higher low. Regular bearish: price higher high, RSI lower high. Hidden bullish: price higher low, RSI lower low. Hidden bearish: price lower high, RSI higher high. A confluence only; any timeframe, the higher the stronger (trader, 2026-09-27)."
    introduced_in: T-0004
  demand_level:
    label: Demand level (S/D)
    definition: "Drawn where price created a bullish CH; stronger with an FVG; high probability when not retested (mitigated), weaker with every mitigation (trader, 2026-09-27)."
    introduced_in: T-0006
  supply_level:
    label: Supply level (S/D)
    definition: "Drawn where price created a bearish CH; stronger with an FVG; high probability when not retested (mitigated). T-0005 is the trader's example."
    introduced_in: "trader statement 2026-09-27 (T-0005)"
  fvg:
    label: Fair value gap (FVG)
    definition: "A gap left by an impulsive move. A supply/demand level that formed an FVG with its CH is stronger; T-0001's demand kept an unfilled FVG (trader, 2026-09-27)."
    introduced_in: "trader statement 2026-09-27"
