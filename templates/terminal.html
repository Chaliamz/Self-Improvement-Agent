<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Trading Terminal</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f1f0ec; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --pos: #2a78d6; --neg: #e34948; --neutral: #898781; --pos-wash: rgba(42,120,214,.10);
  --good: #0ca30c; --critical: #d03b3b; --warning: #fab219; --serious: #ec835a; --good-ink: #006300;
  --track: #cde2fb; --fill: #2a78d6; --focus: #2a78d6; --shadow: 0 8px 24px rgba(0,0,0,.12);
  --up: #009485; --down: #e8474a; --up-text: #00796b; --down-text: #c62828;
  --up-wash: rgba(0,148,133,.12); --down-wash: rgba(232,71,74,.12);
  --glow-up: rgba(0,148,133,.16); --glow-down: rgba(232,71,74,.12); --glow-accent: rgba(42,120,214,.10); --tape-opacity: .07;
  --brand: #6d4bd6; --brand-wash: rgba(109,75,214,.10); --glow-brand: rgba(124,77,255,.16); --bg-opacity: .75;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --pos: #3987e5; --neg: #e66767; --neutral: #898781; --pos-wash: rgba(57,135,229,.12);
    --good-ink: #0ca30c; --track: rgba(57,135,229,.18); --fill: #3987e5; --focus: #3987e5; --shadow: 0 8px 24px rgba(0,0,0,.5);
    --up: #26a69a; --down: #ef5350; --up-text: #26a69a; --down-text: #ef5350;
    --up-wash: rgba(38,166,154,.14); --down-wash: rgba(239,83,80,.14);
    --glow-up: rgba(38,166,154,.20); --glow-down: rgba(239,83,80,.15); --glow-accent: rgba(57,135,229,.12); --tape-opacity: .09;
    --brand: #a594f9; --brand-wash: rgba(165,148,249,.12); --glow-brand: rgba(124,77,255,.24); --bg-opacity: 1;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --pos: #3987e5; --neg: #e66767; --neutral: #898781; --pos-wash: rgba(57,135,229,.12);
  --good-ink: #0ca30c; --track: rgba(57,135,229,.18); --fill: #3987e5; --focus: #3987e5; --shadow: 0 8px 24px rgba(0,0,0,.5);
  --up: #26a69a; --down: #ef5350; --up-text: #26a69a; --down-text: #ef5350;
  --up-wash: rgba(38,166,154,.14); --down-wash: rgba(239,83,80,.14);
  --glow-up: rgba(38,166,154,.20); --glow-down: rgba(239,83,80,.15); --glow-accent: rgba(57,135,229,.12); --tape-opacity: .09;
  --brand: #a594f9; --brand-wash: rgba(165,148,249,.12); --glow-brand: rgba(124,77,255,.24); --bg-opacity: 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--pos); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
header.top { border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
.top-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.brand .sub { color: var(--ink-2); font-size: 12.5px; overflow-wrap: anywhere; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.btn:hover { border-color: var(--axis); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); font-weight: 600; }
nav.tabs button:hover { color: var(--ink); }
.brand h1 .title { background: linear-gradient(90deg, var(--brand), var(--up)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.top-actions select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.btn:hover, .top-actions select:hover { border-color: var(--brand); }
main { padding: 16px 0 48px; }
section.panel { display: none; }
section.panel.active { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 4px; font-weight: 650; }
.card h3 { font-size: 13px; margin: 16px 0 6px; font-weight: 650; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.card .note { color: var(--ink-2); font-size: 12.5px; margin: 0 0 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.grid2 > .card { margin-bottom: 0; }
.stack > * + * { margin-top: 16px; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.banner .phase { font-weight: 650; }
.banner .meter { flex: 1 1 200px; }
.hero { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
.hero .value { font-size: 52px; line-height: 1; font-weight: 650; }
.hero .label { color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.tile .t-label { color: var(--ink-2); font-size: 12.5px; }
.tile .t-value { font-size: 22px; font-weight: 650; margin-top: 2px; }
.tile .t-sub { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap-cell { white-space: normal; min-width: 200px; }
td.tags-cell { white-space: normal; min-width: 420px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: var(--surface-2); }
.linkish { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font-size: 12px; white-space: nowrap; background: var(--surface-2); color: var(--ink); }
.badge .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.badge.unstated { color: var(--ink-2); border-style: dashed; background: transparent; }
.tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); margin: 0 4px 4px 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters label { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 12.5px; }
.filters select, .filters input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.chart-host { width: 100%; min-height: 240px; position: relative; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
svg .axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
svg .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .area { stroke: none; }
svg .dot { stroke: var(--surface); stroke-width: 2; } svg .dot.up { fill: var(--up); } svg .dot.down { fill: var(--down); }
svg .end-label { fill: var(--ink); font-size: 12px; font-weight: 600; }
svg .crosshair { stroke: var(--axis); stroke-width: 1; }
svg .bar-pos { fill: var(--up); } svg .bar-neg { fill: var(--down); } svg .bar-neutral { fill: var(--neutral); }
svg .bar-hit:hover + .bar-mark, svg .bar-hit:focus + .bar-mark { opacity: .8; }
svg .cap-label { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
#tooltip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: none; max-width: 260px; }
#tooltip strong { display: block; font-size: 14px; color: var(--ink); }
#tooltip .row { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
#tooltip .key { width: 12px; height: 2px; background: var(--pos); flex: none; }
details.table-view { margin-top: 10px; }
details.table-view summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
details.table-view .table-wrap { margin-top: 8px; }
.meter-bar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
.meter-bar > span { display: block; height: 100%; background: var(--fill); border-radius: 999px; }
.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 16px; margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
ul.clean { margin: 0; padding-left: 18px; }
ul.clean li + li { margin-top: 3px; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.score-row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; margin: 6px 0; }
.score-row .num { text-align: right; font-variant-numeric: tabular-nums; }
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(980px, calc(100vw - 32px)); max-height: 90vh; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.55); }
.dlg-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; z-index: 1; }
.dlg-head h2 { margin: 0; font-size: 16px; }
.dlg-body { padding: 16px; }
.chart-img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in; }
.empty { color: var(--ink-2); font-style: italic; margin: 4px 0; }
/* backgrounds: one decorative layer at a time, chosen in the header. Never over the data. */
body { position: relative; isolation: isolate; }
#bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; opacity: var(--bg-opacity); }
#bg > * { position: absolute; inset: 0; display: none; }
:root[data-bg="aurora"] #bg .bg-aurora, :root[data-bg="aurora"] #bg .bg-grid,
:root[data-bg-kind="canvas"] #bg #bg-canvas,
:root[data-bg="starfield"] #bg .bg-static, :root[data-bg="waves"] #bg .bg-static, :root[data-bg="depth"] #bg .bg-static,
:root[data-bg="nebula"] #bg .bg-nebula,
:root[data-bg="plasma"] #bg .bg-plasma, :root[data-bg="radar"] #bg .bg-static, :root[data-bg="bubbles"] #bg .bg-static,
:root[data-bg="synthwave"] #bg .bg-synth,
:root[data-bg="tape"] #bg .bg-glow, :root[data-bg="tape"] #bg .bg-grid, :root[data-bg="tape"] #bg #bg-tape,
:root[data-bg="off"] #bg .bg-static { display: block; }
.bg-grid { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 64px 64px; opacity: .35;
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%); mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
  animation: grid-pan 60s linear infinite; }
.bg-static { background: radial-gradient(60% 50% at 15% 10%, var(--glow-brand), transparent 70%), radial-gradient(50% 40% at 90% 90%, var(--glow-accent), transparent 70%); }
/* aurora: three soft blobs on independent orbits; the teal/red one leans with net R */
.bg-aurora { filter: blur(48px); }
.bg-aurora i { position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%; }
.bg-aurora i:nth-child(1) { left: -12vmax; top: -18vmax; background: radial-gradient(circle, var(--glow-brand), transparent 65%); animation: orbit-a 28s ease-in-out infinite alternate; }
.bg-aurora i:nth-child(2) { right: -14vmax; bottom: -20vmax; background: radial-gradient(circle, var(--glow-up), transparent 65%); animation: orbit-b 34s ease-in-out infinite alternate; }
:root[data-pnl="down"] .bg-aurora i:nth-child(2) { background: radial-gradient(circle, var(--glow-down), transparent 65%); }
.bg-aurora i:nth-child(3) { left: 30vw; top: 20vh; width: 42vmax; height: 42vmax; background: radial-gradient(circle, var(--glow-accent), transparent 65%); animation: orbit-c 41s ease-in-out infinite alternate; }
@keyframes orbit-a { to { transform: translate3d(22vw, 16vh, 0) scale(1.15); } }
@keyframes orbit-b { to { transform: translate3d(-26vw, -14vh, 0) scale(1.1); } }
@keyframes orbit-c { 0% { transform: translate3d(-10vw, 0, 0) scale(.9); } 100% { transform: translate3d(12vw, 18vh, 0) scale(1.2); } }
/* synthwave: horizon glow, striped sun, grid floor rolling toward the viewer */
.bg-synth { background: linear-gradient(to bottom, transparent 30%, var(--glow-brand) 55%, transparent 56%); }
.bg-synth .sun { position: absolute; left: 50%; top: 20%; width: 34vmin; height: 34vmin; transform: translateX(-50%); border-radius: 50%;
  background: linear-gradient(to bottom, var(--brand), var(--down)); opacity: .28;
  -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 13px); mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 13px);
  animation: sun-pulse 6s ease-in-out infinite alternate; }
.bg-synth .floor { position: absolute; left: -50%; right: -50%; top: 55%; bottom: -40%; transform-origin: top; transform: perspective(320px) rotateX(62deg);
  background-image: linear-gradient(var(--brand) 1px, transparent 1px), linear-gradient(90deg, var(--brand) 1px, transparent 1px); background-size: 56px 56px; opacity: .22;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%); mask-image: linear-gradient(to bottom, transparent, #000 40%);
  animation: floor-roll 2.4s linear infinite; }
@keyframes floor-roll { to { background-position: 0 56px, 0 0; } }
@keyframes sun-pulse { to { opacity: .4; transform: translateX(-50%) scale(1.04); } }
/* nebula: slow-turning purple, teal and red clouds under a twinkling dust layer */
.bg-nebula::before, .bg-nebula::after { content: ""; position: absolute; }
.bg-nebula::before { inset: -35%; filter: blur(40px) saturate(1.3); animation: nebula-turn 120s linear infinite;
  background:
    radial-gradient(28% 24% at 32% 38%, color-mix(in srgb, var(--brand) 42%, transparent), transparent 70%),
    radial-gradient(24% 20% at 66% 58%, color-mix(in srgb, var(--up) 30%, transparent), transparent 70%),
    radial-gradient(20% 18% at 56% 30%, color-mix(in srgb, var(--down) 26%, transparent), transparent 70%),
    radial-gradient(34% 28% at 40% 72%, color-mix(in srgb, var(--pos) 22%, transparent), transparent 70%),
    radial-gradient(18% 16% at 74% 36%, color-mix(in srgb, var(--brand) 30%, transparent), transparent 70%); }
.bg-nebula::after { inset: 0; opacity: .55; animation: twinkle 7s ease-in-out infinite alternate;
  background-image:
    radial-gradient(1.4px 1.4px at 12px 18px, var(--ink-2) 50%, transparent 51%),
    radial-gradient(1px 1px at 88px 64px, var(--brand) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 150px 130px, var(--ink-2) 50%, transparent 51%),
    radial-gradient(1px 1px at 40px 150px, var(--up) 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 170px 30px, var(--ink-2) 50%, transparent 51%);
  background-size: 190px 190px; }
@keyframes nebula-turn { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.12); } to { transform: rotate(360deg) scale(1); } }
@keyframes twinkle { from { opacity: .25; } to { opacity: .6; } }
/* plasma: a slow conic swirl of the brand, up and down hues under two drifting lights */
.bg-plasma { filter: blur(56px) saturate(1.25); }
.bg-plasma::before, .bg-plasma::after { content: ""; position: absolute; }
.bg-plasma::before { inset: -50%; animation: plasma-spin 48s linear infinite;
  background: conic-gradient(from 0deg at 50% 50%, color-mix(in srgb, var(--brand) 42%, transparent), color-mix(in srgb, var(--up) 30%, transparent),
    color-mix(in srgb, var(--pos) 26%, transparent), color-mix(in srgb, var(--down) 26%, transparent), color-mix(in srgb, var(--brand) 42%, transparent)); }
.bg-plasma::after { inset: -25%; animation: plasma-drift 17s ease-in-out infinite alternate;
  background: radial-gradient(38% 38% at 30% 32%, color-mix(in srgb, var(--up) 28%, transparent), transparent 70%),
    radial-gradient(34% 34% at 70% 66%, color-mix(in srgb, var(--brand) 34%, transparent), transparent 70%); }
@keyframes plasma-spin { to { transform: rotate(360deg); } }
@keyframes plasma-drift { from { transform: translate3d(-6%, -4%, 0) scale(1); } to { transform: translate3d(6%, 5%, 0) scale(1.15); } }
/* journal ticker: the trader's own trades scrolling in large faint type */
:root[data-bg="ticker"] #bg #bg-ticker { display: flex; }
#bg-ticker { flex-direction: column; justify-content: space-around; padding: 4vh 0; }
.tk-row { overflow: hidden; white-space: nowrap; opacity: .085; color: var(--ink); font: 800 clamp(26px, 5.5vw, 68px)/1.1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.01em; }
.tk-row:nth-child(even) { opacity: .055; font-size: clamp(18px, 3.6vw, 44px); }
.tk-strip { display: inline-flex; gap: 2.5ch; padding-right: 2.5ch; animation: tape 110s linear infinite; }
.tk-row:nth-child(2) .tk-strip { animation-duration: 150s; animation-direction: reverse; }
.tk-row:nth-child(3) .tk-strip { animation-duration: 90s; }
.tk-row:nth-child(4) .tk-strip { animation-duration: 170s; animation-direction: reverse; }
.tk-row:nth-child(5) .tk-strip { animation-duration: 130s; }
.tk-item .tk-up { color: var(--up); } .tk-item .tk-down { color: var(--down); } .tk-item .tk-hyp { color: var(--muted); }
/* candle tape (the previous background) */
.bg-glow { background:
    radial-gradient(40% 34% at 18% 22%, var(--glow-up), transparent 70%),
    radial-gradient(34% 30% at 82% 78%, var(--glow-down), transparent 70%),
    radial-gradient(30% 28% at 60% 12%, var(--glow-brand), transparent 70%);
  animation: drift 38s ease-in-out infinite alternate; inset: -25% !important; }
#bg-tape { top: auto !important; height: 42vh; opacity: var(--tape-opacity);
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 100%); mask-image: linear-gradient(to top, #000 10%, transparent 100%); }
#bg-tape .strip { display: flex; width: max-content; height: 100%; animation: tape 120s linear infinite; }
#bg-tape svg { height: 100%; width: auto; flex: none; }
#bg-tape .c-up { fill: var(--up); stroke: var(--up); } #bg-tape .c-down { fill: var(--down); stroke: var(--down); }
#bg-canvas { width: 100%; height: 100%; }
.tag { background: var(--brand-wash); }
svg .bar-up { fill: var(--up); } svg .bar-down { fill: var(--down); }
svg .grow-down { transform-box: fill-box; transform-origin: top; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
svg .whisker { stroke: var(--ink-2); stroke-width: 1.5; }
svg .ref { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 4; }
svg .ref.strong { stroke-dasharray: none; stroke: var(--axis); stroke-width: 1.5; }
svg .ref-label { fill: var(--ink-2); font-size: 11px; }
svg .stem { stroke: var(--axis); stroke-width: 2; stroke-linecap: round; }
svg .pin { stroke: var(--surface); stroke-width: 2; } svg .pin.up { fill: var(--up); } svg .pin.down { fill: var(--down); }
svg .pin.open { fill: var(--surface); stroke: var(--neutral); stroke-width: 2; }
svg .axis-title { fill: var(--ink-2); font-size: 11.5px; }
svg .row-label { fill: var(--ink); font-size: 12px; }
svg .hit:hover + .mark, svg .hit:focus + .mark { opacity: .8; }
@keyframes drift { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(3%, 2.5%, 0) scale(1.08); } }
@keyframes grid-pan { from { background-position: 0 0, 0 0; } to { background-position: 64px 64px, 64px 64px; } }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.up { color: var(--up-text); } .down { color: var(--down-text); }

  let price = 100;
  for (let i = 0; i < n; i++) {
    const open = price, close = open * (1 + (rnd() - 0.48) * 0.06);
    const high = Math.max(open, close) * (1 + rnd() * 0.02), low = Math.min(open, close) * (1 - rnd() * 0.02);
    candles.push({ open, close, high, low }); price = close;

    const H = 240, m = { t: 16, r: 70, b: 30, l: 52 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
