# Road from a discretionary journal to an automated bot.
#
# Stages are strictly ordered: a later stage stays locked until every criterion of the
# earlier one is met. Computed criteria are evaluated from the journal by ./tj build.
# Manual criteria move to `done` only with `evidence:` (a report, test run or commit).
#
# Thresholds are deliberate assumptions, explained in `goal`. Change them only with a reason.

venue:
  exchange: "MEXC"                    # trader, 2026-09-27: "I'm expecting to use MEXC as an exchange to use the bot placing orders"

# Questions the bot's specification still needs answered (shown in the terminal's Data gaps).
open_questions:
  - "1. Leverage on tight stops: when the 50-60% aim would put liquidation at or before the stop (a 0.6% stop needs 83x for 50%; liquidation comes first above about 91x at a 0.5% maintenance rate, earlier on MEXC's higher tiers), the bot would use the highest leverage that keeps liquidation at least 1.5x the stop distance away, even if that falls below 50%. The loss at the stop stays 1% either way. Agreed?"
  - "2. Alerts: where should the bot send a halt or malfunction alert (Telegram, email, both)? After a halt, does it restart only when you restart it?"
  - "3. Pairs: are BTC, ETH and HYPE the USDT-margined perpetual futures on MEXC (BTC_USDT, ETH_USDT, HYPE_USDT)?"
  - "4. Scope: the bot focuses on swing and day trading (1D-4h bias, 1h-30m levels and confirmations). Are 1m-5m scalps like T-0003 outside the bot, left to you by hand?"
  - "5. Split entries: on MEXC one position carries one leverage setting, whatever fills. The bot would set it from the first order (the widest stop), so no combination of fills goes above 60% of the margin at the stop; if all three fill, the share is lower (tj size --add-entry shows each case). Agreed?"
  - "6. Split entries and R: if only 1 of 3 orders (0.3%) fills and the stop is hit, does that count as -1R of the risk actually taken, or -0.3R of the planned 1%? It decides how split trades enter your statistics."
  - "7. The bot runs the checklist, so a trade like T-0009 (graded B, but no 4h zone at the entry: items 1 and 4 fail) would be skipped. Is that what you want, or should some B setups outside a zone still be taken?"

# Mandatory (trader, 2026-09-28: "Yes that's a huge MUST. We need to avoid these types of actions at all costs.
# Protecting our capital is important."). Separate from the trading rules, which have no daily stop and no pause:
# these checks fire only on behaviour a correct bot can never produce. Every check gets a test that trips it
# before the bot sends a single live order (stage 2).
malfunction_guard:
  status: specified                   # specified -> implemented -> tested; no bot code exists yet
  on_trip: >-
    Stop placing new orders, leave every exchange-side stop in place, alert the trader, and log the event as an
    incident. Open positions keep their stops and targets; nothing is closed except by G1.
  checks:
    - id: G1
      name: "Position without a stop"
      trigger: "An entry order sent without an attached exchange-side stop, or a position on the exchange with no live stop order."
      action: "Place the planned stop at once; if the exchange refuses it, close the position at market. Then halt."
    - id: G2
      name: "Risk above 1%"
      trigger: "Size x (entry to stop distance) plus fees is above 1% of equity for the setup (all its split orders together; 0.9% for three), checked before sending and again on every fill."
      action: "Refuse the order; if already filled, reduce the position to 1% risk. Halt."
    - id: G3
      name: "Leverage above the margin rule"
      trigger: "Stop distance % x leverage above 60% of the posted margin."
      action: "Refuse the order. Halt."
    - id: G4
      name: "Liquidation before the stop"
      trigger: "Isolated liquidation, computed with MEXC's maintenance-margin tier for this position size, sits at or inside the stop (warn under 1.5x the stop distance)."
      action: "Refuse the order. Halt."
    - id: G5
      name: "Order burst or duplicate"
      trigger: "More orders in a window than the strategy can produce (limit set from the backtest's highest signal rate), or more orders for one setup than its split plan (at most 3 limits, one stop, one target)."
      action: "Cancel the extra orders. Halt."
    - id: G6
      name: "Order inside the news window"
      trigger: "A new entry or a resting order from 1 hour before to 1 hour after a red USD event on ForexFactory, or the calendar could not be read."
      action: "Refuse or cancel the order; no halt when the calendar merely confirms the window."
    - id: G7
      name: "Pair not on the scan list"
      trigger: "An order on a pair outside profile execution_venue.pairs."
      action: "Refuse the order. Halt."
    - id: G8
      name: "Bot and exchange disagree"
      trigger: "The bot's own record of orders and positions differs from the exchange's (unknown position, missing order, different size or stop)."
      action: "Halt new orders until the trader reconciles."
    - id: G9
      name: "Stale data or repeated errors"
      trigger: "Market data older than one execution candle, the clock off by more than a few seconds, or repeated rejected orders and API errors."
      action: "No new orders until the data is fresh; halt on repeated errors."

stages:
  - id: specify
    name: "1. Specify the rules"
    goal: >-
      Every rule becomes mechanical: a program reading it takes the same trades you do. Losses and
      shorts are required because a rulebook learned only from winning longs has never seen its
      failure modes.
    criteria:
      - {label: "Measured trades journaled", metric: measured_trades, min: 20}
      - {label: "Losses journaled and classified (A-E)", metric: classified_losses, min: 5}
      - {label: "Long trades", metric: longs, min: 3}
      - {label: "Short trades", metric: shorts, min: 3}
      - {label: "Open strategy questions answered", metric: open_questions, max: 0}

  - id: codify
    name: "2. Codify and verify the detector"
    goal: >-
      Code that scans 4H OHLCV + volume finds the setups you journaled, with the same zone, stop and
      target. If the code disagrees with you, a backtest would test a different strategy.
    criteria:
      - label: "Detector reproduces journaled setups"
        manual: pending
        target: "At least 80% of journaled setups found with matching zone, stop and target; every miss explained"
      - label: "Malfunction guard implemented and tripped by tests"
        manual: pending
        target: "Every check G1-G9 in malfunction_guard has a test that trips it and shows the halt, the alert and the incident entry"

  - id: backtest
    name: "3. Backtest out of sample"
    goal: >-
      Hundreds of historical setups are replayed with fees, slippage and funding. This is where the
      sample size comes from: manual trading cannot produce it fast enough.
    criteria:
      - label: "Out-of-sample expectancy is positive"
        manual: pending
        target: "95% CI lower bound of expectancy > 0 on held-out data; n from the sample-size table, never below 100"
      - label: "Result holds across conditions"
        manual: pending
        target: "At least 2 trend regimes and 3 assets; no single asset or month carries the result"
      - label: "Drawdown is survivable at 1% risk"
        manual: pending
        target: "Worst simulated drawdown and losing streak accepted by the trader before going live"

  - id: paper
    name: "4. Forward test without money"
    goal: "The bot runs live on the exchange's data and logs orders without sending them."
    criteria:
      - label: "Forward signals match the backtest"
        manual: pending
        target: "At least 30 signals; expectancy inside the backtest's confidence interval; zero execution errors"

  - id: live_small
    name: "5. Live at reduced risk"
    goal: "Real orders at a quarter of the normal risk, with every safety control switched on."
    criteria:
      - label: "Safety controls verified"
        manual: pending
        target: "All items in `safety` below are in place and tested"
      - label: "Live results match the backtest"
        manual: pending
        target: "At least 30 live trades at 0.25% risk; results inside the backtest's confidence interval"

  - id: live_full
    name: "6. Full risk"
    goal: "Scale to the normal 1% risk only after live evidence agrees with the backtest."
    criteria:
      - label: "Scaled to 1% risk"
        manual: pending
        target: "Trader's explicit decision, recorded with the live report as evidence"

sample_size:
  alpha: 0.05
  power: 0.80
  note: >-
    Trades needed so that, if the edge is real, the 95% confidence interval of expectancy excludes
    zero 80% of the time. Two-outcome model (every loss -1R), so real needs are somewhat higher.
  scenarios:
    - {win_rate: 0.25, avg_win: 3.0}   # zero edge: can never be proven, at any sample size
    - {win_rate: 0.25, avg_win: 4.0}
    - {win_rate: 0.30, avg_win: 3.0}
    - {win_rate: 0.30, avg_win: 4.0}
    - {win_rate: 0.35, avg_win: 3.5}
    - {win_rate: 0.40, avg_win: 3.0}
    - {win_rate: 0.45, avg_win: 3.0}

safety:
  - "API keys never go into chat, the repository or kb.json. They live only in the bot server's secret store or environment."
  - "Keys have trade permission only: withdrawals disabled, IP-whitelisted to the bot's server."
  - "The bot trades a dedicated sub-account funded with only the capital it may risk."
  - "Every order is placed with its exchange-side stop, sized by the 1% rule, with leverage set from the stop distance by the margin rule (aim 50-60% of margin at the stop, never above 60%, margin call at 80%) and capped so liquidation sits beyond the stop."
  - "Trading rules have no daily stop, no pause after losses and no correlation cap (trader, 2026-09-27/28). The malfunction guard (G1-G9 above) is separate and mandatory: it halts on behaviour only a bug produces and alerts the trader."
  - "No new entries and no resting orders from 1 hour before to 1 hour after a red (high-impact) USD event on ForexFactory; open trades are kept (trader, 2026-09-27/28). Otherwise the bot runs 24/7."
  - "Execution is deterministic code, not a language model: the same market data always produces the same orders, and every decision is logged."
