  - id: CHG-004
    kind: clarification
    date: 2026-09-27
    status: adopted
    rule_changed: false
    statement: >-
      Trader, 2026-09-27, answering open questions 7-8: "that new supply level drawn because it created a
      new CH (bearish one in this example that's why its supply level) so we placed short on supply level
      (retest). it makes it stronger when it creates a FVG too. we draw supply demand levels which form a FVG
      +CH. Don't forget! A supply/demand level is high probability when it's not retested(mitigated). AVOID
      Inducements at all costs (AAVE example on liquidity resting-equal lows --> This is an Inducement)."
      On divergence: "most of timeframes can work but it's just a confluence. the higher time frame the
      stronger", with a reference chart of regular and hidden divergences. On S/D levels: "the more a
      supply/demand level mitigates the weaker it becomes." On fees: "Everything is inside them." T-0006:
      "You can watch (2) which is on 1H to understand more how we execute on lower time frames."
    fields: [timeframes, timeframe_alignment, confirmation, confluences, zones, inducements, divergence,
             entry_models.extreme_supply, entry_models.reclaim, stop_model, target_model, risk_model,
             leverage_model, do_not_trade_when, checklist, open_questions]
    note: >-
      Rules already in force, now written down: how zones are drawn (CH + FVG) and graded (fresh beats
      mitigated), inducements avoided, divergence types, the 1h execution of a 4h zone. The T-0006 target
      reflection stays a hypothesis (n=1). T-0001, T-0002, T-0004, T-0005 retagged 1.4; T-0006 recorded at 1.4.
    resulting_version: "1.4"
  - id: CHG-005
    kind: clarification
    date: 2026-09-27
    status: adopted
    rule_changed: false
    statement: >-
      Trader, 2026-09-27: "30m candle should close below the previous bullish 30m candle's low/above the previous
      bearish 30m candle's high to form a potential CH" ... target: "both are ideal but it's more preferable to
      hunt strongest levels (70.7 supply). I closed it because I was happy with RR" ... "TP was 66.1" (T-0006) ...
      divergence: "length is irrelevant and swings on RSI and chart are read on wicks" ... equal lows/highs: "it's
      not that important how close they should be ... still considers as a liquidity level which is likely to get
      swept" ... volume: "much more than 2x, I don't want you to focus a lot on this" ... leverage: "since margin
      call occurs on 80% i prefer to adjust it until 50%, it's okay if it goes to 55% or something." T-0007: "supply
      level didn't get retested so we placed sell limit order there. Our SL would obviously be our latest swing high."
    fields: [timeframe_alignment, market_structure, trend_context, confirmation, confluences, zones.definition,
             zones.extreme_demand, inducements, divergence, entry_models.supply_level, entry_models.demand_level,
             entry_models.extreme_supply, stop_model, target_model, leverage_model, checklist, open_questions]
    note: >-
      Answers recorded as the rules already in force. The new entry models name what T-0005 and T-0007 did
      (a supply level born from a CH); T-0005 moves from extreme_supply to supply_level. The margin rule is a
      50% target with a 55% tolerance, so the validator, tj size and rule compliance flag a breach only beyond
      55%. T-0001, T-0002, T-0004, T-0005, T-0006 retagged 1.5; T-0007 recorded at 1.5.
    resulting_version: "1.5"
  - id: CHG-006
    kind: clarification
    date: 2026-09-27
    status: adopted
    rule_changed: false
    statement: >-
      Trader, 2026-09-27, on the POL trade they avoided (T-0008): "witness on 4H time frame the bullish candle and
      cyan lines. this is the high. to form a pull back from that price it had to break the lowest line and close
      below ... it was a consolidation range. Pullback formed on bearish candles which created that red line which
      is definitely not a CH". Answers: S setup = "proper confluences, clear confirmations, sniper entries leading
      to TP and a high RR (3.5RR and higher)"; counter-trend "graded like any other setup. it's just a bit riskier";
      T-0004's stop and 20x were real; stop beyond the swing that created the confirmed CH: "yes exactly"; stops:
      "we place SL a bit lower on swing low/higher on lower high ... on liquidity level ... we wait for them to
      break-sweep (Liquidity Sweep) and reclaim level so we grab the retest. Perfect example was the AAVEUSDT";
      "on T-0006 there wasn't any mitigation, it was a reclaim level + CH. Mitigation formed on T-0007"; "T-0005 was
      the level that created the reversal, it wasn't a sweep candle. T-0007 that level created the CH, it was close
      to swing high, it could be consider as an inducement as well, that's the reason we places SL above the swing
      high"; bearish continuation: "Lower Low has to close below the previous low (including the wick of previous
      low)".
    fields: [timeframe_alignment, market_structure, trend_context, grading, zones.definition, zones.freshness,
             entry_models.supply_level, entry_models.reclaim, stop_model, checklist, common_mistakes, open_questions]
    note: >-
      Rules already in force, now written down: the candle-range / NOT CH rule (checklist item 3), the stop rule
      (item 5), S grading. Records corrected to the answers: T-0004 (stop and leverage confirmed; false_ch added,
      matching the trader's own "30M consolidation" diagnosis), T-0005 (zone origin), T-0006 (not mitigated; setup
      rescored 4 -> 5), T-0007 (item 5 passes). T-0001, T-0002, T-0004-T-0007 retagged 1.6; T-0008 recorded at 1.6.
    resulting_version: "1.6"
