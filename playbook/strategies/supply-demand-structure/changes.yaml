    kind: clarification
    date: 2026-09-27
    status: adopted
    rule_changed: false
    statement: >-
      Trader, 2026-09-27: "the quality of setup separates S,A,B,C and D. D would definitely be a poor trade+mistake.
      T-0001 would be A ... T-0003 would be C ... T-0006 would be A" ... "Since a CH forms I wait few candles too see if
