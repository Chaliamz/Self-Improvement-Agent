# Append-only log of rule-change proposals for this strategy (§20, §41).
# Never delete or rewrite an entry: update its status and add a new entry.
# Status ladder: observation -> hypothesis -> testing -> provisional -> established (or rejected).
# The validator rejects `provisional` / `established` without enough evidence trades.

# Two kinds:
#   rule_change (default): evidence-driven, follows the ladder and the promotion gates.
#   clarification: the trader states rules that were already in force. No performance claim,
#     no evidence gate: status must be `adopted`, rule_changed must be false, and the trader's
#     statement is quoted.

changes:
  - id: CHG-001
    kind: clarification
    date: 2026-09-27
    status: adopted
    rule_changed: false
    statement: >-
      Trader, 2026-09-27, answering open questions 1-5: "on resistance/support level or even a trendline. to
      be valid it's more preferable to have at least 3 reactions" ... "I chose is because of the lower wick it
      created and closed bullish so it was a ltf point of interest, there wasnt proper data there" ... "We
      prefer starting 30M-1H time frame to identify bias and structure then we go to 15M to identify key
      levels+liquidity and we can find confirmations on 1M-5M" ... fees: "Everything is inside them" ...
      T-0003 duration: "I measured it approximately, if anything goes wrong you can fix it."
    fields: [timeframes, top_down, level_definition, required_conditions, target_model, risk_model, context,
             open_questions]
    note: "T-0003 retagged 1.1; its duration corrected to the chart measurement (24 minutes)."
    resulting_version: "1.1"
  - id: CHG-002
    kind: clarification
    date: 2026-09-27
    status: adopted
    rule_changed: false
    statement: >-
      Trader, 2026-09-27: "we can't know that from first place. we grab a level and we see if that level is key
      for traders. If it reacts or not. Resistance if it touches many times and reacts with rejection or breaks
      past it, retests and goes higher. Or creates a deviation which breaks past it, retests and fails to go
      higher resulting losing the level once again. In this case it's deviation most of times so we take the
      retest for continuation."
    fields: [reactions, open_questions]
    note: "T-0003 retagged 1.2."
    resulting_version: "1.2"
  - id: CHG-003
    kind: clarification
    date: 2026-09-28
    status: adopted
    rule_changed: false
    statement: >-
      Trader, 2026-09-28: "always aim for 50-60% at the stop" ... "they can resume after 1H after manipulation could
      stop. anything resting gets cancelled too." Trader, 2026-09-27: "we avoid macroeconomic data 1 Hour before event
      occurs. Forexfactory.com ... we focus only on USD and red symbols (high impact)."
    fields: [leverage_model, do_not_trade_when]
    note: "Account-wide rules restated for this strategy. T-0003 retagged 1.3."
    resulting_version: "1.3"
