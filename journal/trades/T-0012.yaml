journal:
  before: |
    Reconstructed from the trader's account on 2026-10-10 (after the outcome, so not hindsight-proof).
    (1) A 4H reversal "CH" showing a high possibility of continuation. The green box is the demand level, formed on
    the 1H. (2) On the 1H, a form of inducement on the 0.047 area making equal lows: a liquidity level, highly likely
    to be swept in the future. The green box is the demand that did not get tested yet, with a slight FVG remaining:
    a zone that could be strong enough to push higher. Plan: buy limit on the 1H demand level, SL below that swing
    low in case the setup gets invalidated. Target: the 0.053 level, where there is a supply level. Confluences: the
    untested 1H demand; equal lows that formed a liquidity level before the CH. Confirmation: bullish CH. Risk 1%,
    Risk/Reward 6.68. The buy limit was placed once the CH formed and rested until it filled: "the limit order placed
    much earlier as long as CH formed so that order could be pending for a long time" (trader, 2026-10-13). 20x.
  during: |
    Aug 14: the 12:00 30m bar swept the equal lows; the 13:00 bar filled the resting 0.04564 limit and wicked to about
    0.0452 (0.38R against, 0.61R above the stop); price based at the zone until 15:00, then rose. Aug 15-16: a steady
    climb; the target filled in the Aug 16 10:30 30m bar (the trader first recalled 06:00, then confirmed 10:30). The stop
    was never approached.
  after: |
    Trader: "Im going to show you another one great example on how to perform to hunt high RR." "Setup was
    definitely S, because it met our criteria (CH+DEMAND+ Avoiding inducement) + Very good RR." Result: profit at
    the target, 6.68RR. Duration as first stated: "14/8/26 15:00 - 16/8/26 14:00"; corrected (2026-10-13): "the position
    opened at 13:00 ... exit was at 16/8/26 at 06:00 am". Leverage: "i used 20X leverage". News: "no it wasnt red on
    forex factory so trade could be placed again."
    On the target (2026-10-13): "its ideal the tp to go at the far edge, it depends also the RR. for example T-0012 it's
    not necessary as long as RR was already high, however we can't know if price could go higher which it did going on
    that FVG level/supply (green box) (5), that trade could catch 17.03RR. This trade didn't get executed, im referring
    it as an example ... In that case we could grab 50% of profits when price reaches TP level and lets it run on the
    next level. We place our SL on our entry (BE-Break Even) so we are profitable and risk free. Keep in mind on that one
    is a speculation for now, so we don't change any plans. However you can remind me in case we moved in that way until
    I give you the green."

