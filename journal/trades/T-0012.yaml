journal:
  before: |
    Reconstructed from the trader's account on 2026-10-10 (after the outcome, so not hindsight-proof).
    (1) A 4H reversal "CH" showing a high possibility of continuation. The green box is the demand level, formed on
    the 1H. (2) On the 1H, a form of inducement on the 0.047 area making equal lows: a liquidity level, highly likely
    to be swept in the future. The green box is the demand that did not get tested yet, with a slight FVG remaining:
    a zone that could be strong enough to push higher. Plan: buy limit on the 1H demand level, SL below that swing
    low in case the setup gets invalidated. Target: the 0.053 level, where there is a supply level. Confluences: the
    untested 1H demand; equal lows that formed a liquidity level before the CH. Confirmation: bullish CH. Risk 1%,
    Risk/Reward 6.68.
  during: |
    Aug 14: the 12:00 30m bar swept the equal lows; the 13:00 bar traded through the 0.04564 limit to about 0.0452
    (0.61R above the stop) and price based at the zone until 15:00, then rose. Aug 15-16: a steady climb; the target
    filled in the Aug 16 10:30 30m bar. The stop was never approached.
  after: |
    Trader: "Im going to show you another one great example on how to perform to hunt high RR." "Setup was
    definitely S, because it met our criteria (CH+DEMAND+ Avoiding inducement) + Very good RR." Result: profit at
    the target, 6.68RR. Duration as stated: "14/8/26 15:00 - 16/8/26 14:00".

