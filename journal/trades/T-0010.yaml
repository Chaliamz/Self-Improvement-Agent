journal:
  before: |
    Reconstructed from the trader's account on 2026-09-28 (after the outcome, so not hindsight-proof).
    Bias bearish (on a higher timeframe, not visible at this zoom). Price reached the resistance level (yellow line)
    after creating a Higher Low. When it broke the resistance level, sellers were aggressive and brought price down,
    forming a bearish CH. Confluences: bearish divergence 1H-2H-4H; the supply level from the entry point to the high,
    which formed the bearish CH; CPI higher than expected, bearish news ("we had macroeconomic data back in a day").
    Confirmations: the bearish CH, and the supply level not tested. Sell limit at the supply with 2.57% invalidation,
    20x, risk 1%. Target: the mini demand level below (red box), 2.57RR.
  during: |
    The limit filled on the May 12 13:00 bar and price fell to about 1.5269 by 19:00 (+1.65R), then rallied through
    the stop in the 22:00 bar. Trader: "our setup got invalidated and they pushed NEAR higher because of bullish news
    of NEAR."
  after: |
    Trader: "We couldn't do anything in this case, setup was A even though it was lost."

