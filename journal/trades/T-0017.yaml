journal:
  before: |
    Reconstructed from the trader's account on 2026-10-22 (after the outcome, so not hindsight-proof).
    4H: price at ATH (All Time High) levels, also visible on the 1D; going against the trend is "a risky decision ... but
    worth when you have enough data that can potentially reward you well". Confluences: the green box (demand), an FVG,
    the supply level (red box 94.903-98.063), the liquidity level (yellow line). Confirmations: a bearish CH on the 4H;
    the unmitigated supply level above the liquidity level; the unmitigated demand level (green box), unmitigated when
    the CH happened. "So we expect a sweep on that supply level and target demand level down." Stop right above the last
    swing high. Invalidation 3.64%, so 12x; risk 1%; RR 4.
  during: |
    Oct 5 23:00: the rally reached the 94.869 limit; the Oct 6 ~01:00 1h bar wicked to about 95.23, through the $$ highs
    and just inside the supply (0.10R against). Price fell to about 82.65 by Oct 8 ~21:00 (+3.54R open), bounced to about
    88.05 on Oct 12 ~08:00 (+1.97R open), then dropped to the 81.049 target on Oct 13 ~02:00.
  after: |
    Trader: "Setup was definitely A, because we went against the trend (Daily is still bullish or even Higher Time
    frames) Our confirmations were strong enough giving us good RR." "We couldnt know if price could push even lower than
    demand level but thats irrelevant as long as it was untested. After hitting TP it proved that demand had no power so
    it's a failed one." "Result: WIN."

