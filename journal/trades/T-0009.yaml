journal:
  before: |
    Reconstructed from the trader's account on 2026-09-28 (after the outcome, so not hindsight-proof).
    Plan long, bias bullish. There was a bullish momentum creating a FVG and some form of liquidity (yellow
    trendline) that price could hunt. On the 1H a potential support/resistance level (cyan line) proved to be a
    potential key level. It formed a Lower Low, struggled to break the Lower High (start of the green line,
    "Bullish CH"), broke past it on the second try and reclaimed the cyan line. Plan: long on the retest, target
    the supply level (red box), SL tight in case the S/R level is invalidated. Risk 1%, 10x (invalidation 4.94%).
    Trader: "I ignored FVG on the left so I knew that this execution was risky, however setup was decent with
    these confirmations and good RR (1:3)".
  during: |
    The reclaim ran to about 0.3809 (Apr 29 ~07:00), then price fell back under the cyan level (4h close about
    0.3508 on Apr 29) and hit the stop: "It formed a deviation (fakeout) and invalidated my setup."
  after: |
    Trader: "I'd consider this as a mistake because price was in the middle of nowhere. I'd focus at 0.27-0.31
    zone to consider looking for longs. Where even on that way setup would be invalidated because it went lower
    (You can't see that here) but there was nothing we could do in that case. So mistake here was early
    execution, ignoring FVG, regardless how worth trade was for these confirmations and RR." Grade: "Setup B
    because of FVG ignorance but decent confirmations where could lead to good RR."

