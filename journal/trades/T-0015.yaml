  interpreted:
    - "The trader's T-0012 pattern again: an unmitigated demand with an FVG, equal lows just above it as the inducement, the limit at the demand (not at the equal lows), the stop under the demand, the target at the last swing high."
    - "Counter-trend on the daily (bearish), with the 4h (the rally from the August lows had made higher highs). Graded A; T-0014, a short against the bullish HTF, was graded B 'because we went against the trend'. What separates them (trader, 2026-10-19): 'we had extra data + demand didnt get tested so we had to expect a sweep or a failed demand level which could potentially change our bias': a fresh zone with extra data, against T-0014's retested zone that failed mid-range."
