journal:
  before: |
    Reconstructed on 2026-10-18, after the outcome, as a teaching example: the trader found the setup too late to trade
    it ("only for giving feedback and proper execution").
    Daily: the HTF trend is bearish. On the 1H there was a liquidity level above the green box (demand), from
    21/9/26 05:00 to 24/9/26 12:00, including an FVG, likely to get swept, and the demand had never been mitigated:
    "it was obvious that we avoid this inducement level". A limit buy at the demand (0.2101), SL below it (0.2041), TP
    on the last swing high (0.2453): a day trade, 5.87RR. "That level got tested and pushed price higher forming a new HL."
  during: ""
  after: |
    Trader: "Long setup on BERA would be A because of inducement-unmitigated demand level and a great RR." "With that
    proper execution both setups combine would reward us to 9.79RR in total" (with T-0016). "None of these setups got
    executed, they are only for information and feedback." "Keep this in your memory."
    Asked which CH let the limit rest (2026-10-20): "Due to liquidity level we can't know if that green area from start could be a CH because of demand and FVG. So since price got swept we could look for supply level at previous high on low time frame but it would be risky and it got invalidated either way. So our HL was our candle where red line starts and we broke structure from previous highs so we have a BOS. However price closed below HL so we have CH and you can see once again the confluences that exist on chart. And yes that limit rested at 0.2101"
    "Yes CH and demand level are important ones especially when demand level or supply are unmitigated having FVG. The more confluences there are, the better."

