journal:
  before: |
    Reconstructed from the trader's account on 2026-10-16 (after the outcome, so not hindsight-proof).
    (1) The green box 157.36-160.26 was a decent demand level where confirmations could be looked for on the 1H or 30M
    (for a long), but there was no confirmation, so it was passed. It had been retested many times, so it was
    potentially a key level for a position (the red circles: how many times it was retested and failed afterwards,
    also on the 1H). Confluences: plenty of liquidity levels; 2 green demand levels; an FVG on the lowest demand level
    which formed an inducement/liquidity. Confirmations: the highest demand level failed, so a retest for continuation
    lower was expected; price could go lower to absorb extra liquidity and then go higher; even though the HTF bias was
    bullish, a solid setup with a good RR (3.81). Sell limit on the cyan line; on the 1H a mini FVG that could absorb
    and continue lower. 10x, invalidation 3.02%, risk 1%.
  during: |
    Oct 16: the 01:00 1h bar reached the 158.67 entry (the 05:00 bar the 159.89 cyan line); price dipped to about 156.49
    at 02:00 (+0.46R), then climbed through the morning; the 14:00 bar spiked to about 165.70 through the 163.46 stop. By
    16:00 price was back at about 159.9 and stood at 160.69 at the screenshot (17:51).
  after: |
    Trader: "Setup was B, because even though we had solid confirmations and good RR we went against the trend so it
    had potential risk." "Result: LOSS." "It was a solid trade even though it didn't pay out, I would definitely go for
    the same setup again in the future."

