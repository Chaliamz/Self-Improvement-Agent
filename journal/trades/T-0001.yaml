journal:
  before: |
    Reconstructed from the trader's account on 2026-09-26 (after the outcome, so not hindsight-proof).
    4H AAVE. Bearish leg made a lower low; strong bullish reversal followed but did not CLOSE above
    the last lower high (green "CH" line), so no bullish CHoCH yet. Equal lows formed at 89.36 =
    inducement (liquidity resting below). Price then broke the last lower high: structure bearish ->
    bullish. Noted the wick + higher low at the yellow line as a potential level.
    Plan: long at the extreme demand level (red box). That entry was missed (not at home; see T-0002).
    Price swept the equal lows into the extreme demand zone, then reclaimed the 89.36 line (former
    inducement) as support. Took the long on that reclaim with TP at the yellow line.
  during: |
    Held 2026-04-20 to 2026-05-10 through choppy conditions (trader's words).
  after: |
    Trader, 2026-09-26: "Entry to SL range (invalidation) was 3,14% so I used 10x leverage", 1% risk.
    The chart levels (90.41 / 87.59) give 3.12%; the 0.02-point gap is unexplained (actual fill?).
    Stop placement (trader): "the liquidity level which reclaimed support level from left ... in case
    price would reverse back there and prices moves lower or enters a consolidation phase."
    Leverage check (trader): 3.14% x 10x = 31.4% loss on margin at the stop, inside the 50% rule.
    TP hit. Trader stated R:R 4.57. Trader stated the method: supply/demand levels + price action /
    market structure, with liquidity levels as confluences; asked for these to be memorised.

