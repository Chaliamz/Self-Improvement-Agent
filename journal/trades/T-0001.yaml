  lesson: >-
    When the primary entry at extreme demand was missed, a reclaim of the swept inducement level
    gave a defined-risk re-entry that captured the move. This is one example: track reclaim entries
    and extreme-demand entries separately. The stop sat at a liquidity level from the left that
    had been reclaimed as support. A return there would have invalidated the reclaim (reversal lower
    or consolidation), so the stop protects the reclaim thesis, not the whole demand zone.
