journal:
  before: |
    Reconstructed from the trader's account on 2026-09-27 (after the outcome, so not hindsight-proof).
    Bias bullish, but potentially bearish because of the 4h CH (red dashed line). Confluences: 4h demand
    level (green box), RSI bullish divergence (4h), resistance at 62.64. Confirmations: bullish reversal
    (green CH line), demand reclaimed, then retest and entry at the demand with the stop on the last swing
    low. Risk 1%, leverage 7-8x because of the 6.26% invalidation.
  during: |
    The retest wicked into the demand at entry (low about 53.30), about 0.33R against the position; the stop
    was never approached. Price ranged about 53.3-60.4 for 12 days, then broke 62.64 and 66.10 in the
    Aug 19 ~22:00 1h candle.
  after: |
    Trader: "trade was won definitely a great setup ... There wasn't any mistake here, only to place my TP
    on supply level (red box) to hunt better RR." On the target: "target was the 62.64 resistance level (i
    could target for longer (70.70 supply level)) but 3.41RR was good for me back in a day."
    Correction (trader, 2026-09-27): "that would be my fault. Our goal was 66.1, I ignored 62.64 because of
    potential key level. TP was 66.1". On the target choice: "both are ideal but it's more preferable to hunt
    strongest levels (70.7 supply). I closed it because I was happy with RR". On 7x vs 8x: "it's a personal
    preference ... i prefer to adjust it until 50%, it's okay if it goes to 55% or something."

