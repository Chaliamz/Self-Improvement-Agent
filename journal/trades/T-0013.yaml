journal:
  before: |
    Reconstructed from the trader's account on 2026-10-14 (after the outcome, so not hindsight-proof).
    Top Down Analysis. (1) Weekly: a bearish trend with LH and LL, but price closed above the green line (CH): a
    potential Weekly CH. (2) 1D: liquidity levels, support/resistance and demand/supply levels, the levels to find
    confirmations for execution. "The higher price is (Premium Level) the more we consider looking for Day trading
    because it has potential to go lower to mitigate FVGs or demand levels." (3) 4H: a support level (the 81,224 range;
    "it's not a specific price, it's a range depending on how much price reacts") and a demand level (green box,
    80,095-80,579) which formed the weekly and daily CH and broke the support level. (4) 1H/30M: after the retest of
    the demand level, a breaker block and an FVG on the 30M (new green box); plenty of liquidity levels to avoid, not to
    get swept; resistance at the 84,300 range.
    Plan: long, a day trade ("stick to Day trading for now as long as price didn't plummet deeper to find swing
    trades"). No CH on the 30M, "however FVG and BB breaking a solid support level seemed a solid choice to enter for a
    trade as a continuation on fresh level". TP at the supply level close to resistance, SL on the last low. 20x,
    invalidation 1.09%, RR 3.11.
  during: |
    Oct 13: price fell from about 83,000 (00:00) into the 30M box; the tool starts at 03:00 and the 03:30 bar wicked to
    about 80,950 (the daily low 80,953.41), 0.31R against. Then a steady rally; the target filled in the 11:00 bar.
  after: |
    Trader: "Setup was A because our data was good enough to execute with confirmations and our reward was 3,11 which
    is very good for us." "Result: Profit."

